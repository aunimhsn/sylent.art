# Builds the site and deploys it to GitHub Pages on every push to main, that is when a pull
# request is merged. From the Astro guide: https://docs.astro.build/en/guides/deploy/github/
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
        # Until the launch (step 11), the site is checked at its github.io address; remove
        # these two variables once the domain sylent.art points to GitHub Pages.
        env:
          SITE_URL: https://aunimhsn.github.io
          BASE_PATH: /sylent.art

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
