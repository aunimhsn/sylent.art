<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formations · Sylent</title>
<meta name="description" content="Les modules de formation en informatique, du HTML à l’IA, par domaine : indépendants, aux durées adaptables, sur site ou à distance, pour les écoles, les organismes de formation et les entreprises.">
<!--
  The offer list of sylent.art (/courses, mock-up, step 4 of roadmap.md), shown at phone and
  desktop width by home.html (?page=courses). The parts shared by every page are in shared/.
  Layout, chosen by the owner instead of courses.excalidraw: the top of page of the contact page
  (the grid of the hero, fading out), then one section per domain with one card per module, in the
  style of the domain cards of the home page, each with its own animated cover (shared/site.js,
  shared/covers.js). The home page keeps one card per domain.
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500&display=block">
<link rel="stylesheet" href="shared/site.css">
<style>
  /* ── Page ──────────────────────────────────────────────────────────────────────── */

  .app-courses { padding: calc(var(--header-height) + clamp(48px, 7vw, 96px)) 0 clamp(80px, 11vw, 140px); }
  /* Texture: the grid of the hero of the home page, from the top of the page; it fades out
     before the cards. */
  .app-courses-head { position: relative; }
  .app-courses-head::before,
  .app-courses-head > .app-grid-fluid {
    content: "";
    position: absolute;
    z-index: -1;
    left: 50%;
    width: 100vw;
    translate: -50% 0;
    top: calc(-1 * (var(--header-height) + clamp(48px, 7vw, 96px)));
    bottom: 0;
    mask-image: linear-gradient(#000 35%, transparent);
    pointer-events: none;
  }
  /* The orange fluid of the grid (site.js) lies in a layer at the same place, with the same mask. */
  .app-courses-head::before {
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* ── Links to the domains, under the text ──────────────────────────────────────── */

  .app-jumps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .app-jumps a { display: block; padding: 9px 15px; border: 1px solid var(--line-strong); border-radius: var(--radius-chip); color: var(--secondary); font: 600 14px/1 var(--font-title); transition: color .3s, border-color .3s; }
  .app-jumps a:hover { border-color: var(--text); color: var(--text); }

  /* ── One section per domain ─────────────────────────────────────────────────────── */

  .app-domain { margin-top: clamp(64px, 8vw, 112px); scroll-margin-top: calc(var(--header-height) + 24px); }
  .app-domain-head { display: grid; gap: 12px; margin-bottom: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  @media (min-width: 900px) { .app-domain-head { grid-template-columns: 1fr auto; align-items: end; column-gap: 40px; } }
  .app-domain-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .app-domain-title h2 { margin: 0; font: var(--title-weight) clamp(28px, 3.4vw, 40px)/1.1 var(--font-title); letter-spacing: var(--title-tracking); }
  .app-domain-title .app-new { position: static; }
  .app-domain-head p { grid-column: 1; margin: 0; color: var(--secondary); font-size: 17px; }
  .app-domain-head .app-link { justify-self: start; }
  @media (min-width: 900px) { .app-domain-head .app-link { grid-column: 2; grid-row: 1 / span 2; align-self: end; } }
</style>
</head>
<body data-page="courses">
<script src="shared/site.js"></script>

<main id="content"></main>

<script>
  // The domain pages are not in the mock-up yet: their links lead nowhere for now.
  const domainSection = domain => `
    <section class="app-domain" id="${domain.slug}" aria-labelledby="${domain.slug}-title">
      <div class="app-domain-head app-reveal">
        <div class="app-domain-title"><h2 id="${domain.slug}-title">${domain.title}</h2>${domain.isNew ? '<span class="app-new">Nouveau</span>' : ""}</div>
        <p>${domain.summary}</p>
        <a class="app-link" href="#" aria-label="${domain.title}${NB}: voir le domaine">Voir le domaine</a>
      </div>
      <ul class="app-cards is-domains">${domain.modules.map(moduleCard).join("")}</ul>
    </section>`;

  document.getElementById("content").innerHTML = `
    <section class="app-courses" aria-labelledby="courses-title">
      <div class="app-wrap">
        <div class="app-courses-head" data-grid>
          ${heading("Formations", "Apprendre", "courses-title", 1)}
          <p class="app-lead app-reveal">Des modules indépendants, à prendre seuls ou à combiner, aux durées toujours adaptables, sur site ou à distance.</p>
          <nav aria-label="Domaines" class="app-reveal">
            <ul class="app-jumps">${DOMAINS.map(domain => `<li><a href="#${domain.slug}">${domain.title}</a></li>`).join("")}</ul>
          </nav>
        </div>
        ${DOMAINS.map(domainSection).join("")}
      </div>
    </section>
    ${siteCta(`Un domaine qui n’est pas dans la liste${NB}?<br>Parlons-en.`)}
    ${siteFooter()}`;
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module" src="shared/covers.js"></script>
</body>
</html>
