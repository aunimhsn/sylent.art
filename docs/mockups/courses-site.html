<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formations · Sylent</title>
<meta name="description" content="Les modules de formation en informatique, du HTML à l’IA, par domaine : indépendants, aux durées adaptables, sur site ou à distance, pour les écoles, les organismes de formation et les entreprises.">
<!--
  The offer list of sylent.art (/courses, mock-up, step 4 of roadmap.md), shown at phone and
  desktop width by home.html (?page=courses). The parts shared by every page are in shared/.
  Layout, chosen by the owner instead of courses.excalidraw: the top of page of the contact page
  (the grid of the hero, fading out), then one card per module, all in one grid, in the style of
  the domain cards of the home page: its own animated cover, its name and its domain
  (shared/site.js, shared/covers.js). The home page keeps one card per domain.
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500&display=block">
<link rel="stylesheet" href="shared/site.css">
<style>
  /* ── Page ──────────────────────────────────────────────────────────────────────── */

  .app-courses { padding: calc(var(--header-height) + clamp(48px, 7vw, 96px)) 0 clamp(80px, 11vw, 140px); }
  /* Texture: the grid of the hero of the home page, from the top of the page; it fades out
     before the cards. */
  .app-courses-head { position: relative; }
  .app-courses-head::before,
  .app-courses-head > .app-grid-fluid {
    content: "";
    position: absolute;
    z-index: -1;
    left: 50%;
    width: 100vw;
    translate: -50% 0;
    top: calc(-1 * (var(--header-height) + clamp(48px, 7vw, 96px)));
    bottom: 0;
    mask-image: linear-gradient(#000 35%, transparent);
    pointer-events: none;
  }
  /* The orange fluid of the grid (site.js) lies in a layer at the same place, with the same mask. */
  .app-courses-head::before {
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }
</style>
</head>
<body data-page="courses">
<script src="shared/site.js"></script>

<main id="content"></main>

<script>
  document.getElementById("content").innerHTML = `
    <section class="app-courses" aria-labelledby="courses-title">
      <div class="app-wrap">
        <div class="app-courses-head" data-grid>
          ${heading("Formations", "Apprendre", "courses-title", 1)}
          <p class="app-lead app-reveal">Des modules indépendants, à prendre seuls ou à combiner, aux durées toujours adaptables, sur site ou à distance.</p>
        </div>
        <ul class="app-cards is-domains">${DOMAINS.flatMap(domain => domain.modules.map((module, index) => moduleCard(domain, module, index === 0))).join("")}</ul>
      </div>
    </section>
    ${siteCta(`Un domaine qui n’est pas dans la liste${NB}?<br>Parlons-en.`)}
    ${siteFooter()}`;
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module" src="shared/covers.js"></script>
</body>
</html>
