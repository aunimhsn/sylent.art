<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À propos · Sylent</title>
<meta name="description" content="Aunim Hassan, formateur en informatique depuis 2021 : son parcours, son approche pédagogique et les écoles qui lui font confiance.">
<!--
  The about page of sylent.art (mock-up, step 4 of roadmap.md), shown at phone and desktop width
  by home.html (?page=about). The parts shared by every page are in shared/; the figures, the
  steps of the approach and the partners are the same as on the home page (shared/site.js).
  Layout: after set 1 of the wireframes of step 3, in the Git history (about.excalidraw), without the portrait: the name and
  the background on the left, over the grid; the key figures; the pedagogy; the partners; the
  administrative information; the call to action.
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500;700&display=block">
<!-- Bodoni Moda for the Roman numerals of the pedagogy, only its letters I, V and X. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&text=IVX&display=block">
<link rel="stylesheet" href="shared/site.css">
<style>
  /* ── Hero: the name and the background, on the left, over the grid ─────────────── */

  .app-about-hero { position: relative; padding: calc(var(--header-height) + var(--space-fluid-2)) 0 var(--space-fluid-3); }
  .app-about-hero::before,
  .app-about-hero > .app-grid-fluid {
    content: "";
    position: absolute;
    inset: 0;
    mask-image: radial-gradient(80% 75% at 30% 40%, #000 30%, transparent 75%);
    pointer-events: none;
  }
  /* The orange fluid of the grid (site.js) lies in a layer at the same place, with the same mask. */
  .app-about-hero::before {
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-step) var(--grid-step);
  }
  .app-about-hero .app-wrap { position: relative; }
  .app-about-title { margin: 0; font: var(--title-weight) var(--size-display)/0.98 var(--font-title); letter-spacing: var(--tracking-title); }
  .app-about-role { margin: var(--space-5) 0 0; font: 700 var(--size-role)/1.3 var(--font-title); letter-spacing: var(--tracking-card); }
  .app-about-story { margin: var(--space-6) 0 0; max-width: var(--measure); color: var(--secondary); font-size: var(--size-intro); text-wrap: pretty; }
  .app-about-story + .app-about-story { margin-top: var(--space-4); }

  /* ── Figures, larger than on the home page: they open the page ───────────────────── */

  .app-about-figures .app-figures { margin: 0; }
  .app-about-figures .app-figures strong { font-size: var(--size-figure-large); }
  .app-about-figures .app-figures div > span { font-size: clamp(var(--size-caption), 1.3vw, var(--size-text-small)); }

  /* ── Administrative information: a glass panel ──────────────────────────────────── */

  .app-admin { display: grid; gap: var(--space-3); max-width: var(--width-narrow); margin-inline: auto; padding: var(--card-padding-block) var(--card-padding-inline); }
  .app-admin h2 { margin: 0 0 var(--space-1); font: 700 var(--size-card-title)/1.2 var(--font-title); letter-spacing: var(--tracking-card); }
  .app-admin p { margin: 0; color: var(--secondary); font-size: var(--size-text-small); }
  .app-admin strong { color: var(--text); font-weight: inherit; }
  .app-admin .app-link { justify-self: start; margin-top: var(--space-2); }
</style>
</head>
<body data-page="about">
<script src="shared/site.js"></script>

<main id="content"></main>

<script>
  // ── Content: after the former site and the wireframe ────────────────────────────────
  const STORY = [
    `Passionné par le web depuis plus de dix ans, j’ai étudié l’informatique à l’Exia CESI de Toulouse, puis travaillé en développement web et évolué au sein d’une équipe agile.`,
    `Autodidacte dans l’âme, je forme depuis 2021 des étudiants, des personnes en reconversion et des salariés, avec une conviction${NB}: chacun peut progresser, à son rythme, quand il est bien accompagné.`,
  ];

  const hero = `
    <section class="app-about-hero" aria-labelledby="about-title" data-grid>
      <div class="app-wrap">
        <div>
          <h1 class="app-about-title app-reveal" id="about-title">Aunim Hassan</h1>
          <p class="app-about-role app-reveal">Formateur en informatique depuis 2021</p>
          ${STORY.map(paragraph => `<p class="app-about-story app-reveal">${paragraph}</p>`).join("")}
        </div>
      </div>
    </section>`;

  const figures = `
    <div class="app-wrap app-about-figures app-reveal">${figureList()}</div>`;

  const approach = `
    <section class="app-section" aria-labelledby="approach-title">
      <div class="app-wrap">
        ${heading("Pédagogie", "Accompagner", "approach-title")}
        ${stepList()}
      </div>
    </section>`;

  const partners = `
    <section class="app-section" aria-labelledby="partners-title" style="padding-top:0">
      <div class="app-wrap">
        ${heading("Partenaires", "Confiance", "partners-title")}
        ${partnerReel()}
      </div>
    </section>`;

  const admin = `
    <section class="app-section" aria-labelledby="admin-title" style="padding-top:0">
      <div class="app-wrap">
        <div class="app-admin app-glass app-reveal">
          <h2 id="admin-title">Informations administratives</h2>
          <p>Micro-entreprise · SIRET${NB}: 894${NB}104${NB}132${NB}00010 · NDA${NB}: 76311138131</p>
          <p><strong>Cet enregistrement ne vaut pas agrément de l’État.</strong></p>
          <a class="app-link" href="${PAGES.legal}">Mentions légales</a>
        </div>
      </div>
    </section>`;

  document.getElementById("content").innerHTML = hero + figures + approach + partners + admin + siteCta() + siteFooter();
  spinPartners();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
</body>
</html>
