<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylent · Formateur en informatique</title>
<meta name="description" content="Formateur en informatique depuis 2021 : développement, bases de données, tests, Python et IA, pour les écoles, les organismes de formation et les entreprises.">
<!--
  The home page of sylent.art (mock-up, step 4 of roadmap.md), shown at phone and desktop width
  by home.html; open it alone to see it at the width of the window.
  ?motion=off shows the page without animations, as for a visitor who asked their system to
  reduce motion; ?shot=1 copies the 3D scene into an image, since headless screenshots don't
  show WebGL.

  Layout: set 1 of docs/wireframes (home.excalidraw). The style only sets tokens (CSS variables
  under :root[data-theme="…"]); the components use nothing else.
  Brand: the mark and the SYLENT wordmark (Montserrat 800, -0.195 em, drawn as a path so that
  the site loads no third font) follow the charter of sylent-slides. The section headings take
  up the principle of the former site: a title over a large faded word (Partenaires over
  Confiance).
  Fonts: Manrope (titles, interface) and Roboto (text), from Google Fonts here, self-hosted by
  the site. Three.js and GSAP come from jsDelivr here; the site will bundle them.
  The texts are sample content close to specs.md; the phone number and the photo are
  placeholders, and the logo of IGENSIA Tech is missing.
-->
<script>
  // The motion is chosen before the first paint, so that nothing flashes.
  const query = new URLSearchParams(location.search);
  const reduced = query.get("motion") === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.dataset.motion = reduced ? "off" : "on";
  // Open decision: the font of the text (?text=roboto|open-sans|google-sans|alegreya-sans).
  const texts = ["roboto", "open-sans", "google-sans", "alegreya-sans"];
  document.documentElement.dataset.text = texts.includes(query.get("text")) ? query.get("text") : "roboto";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:ital,wght@0,400;0,500;1,400&family=Open+Sans:ital,wght@0,400;0,500;1,400&family=Google+Sans:ital,wght@0,400;0,500;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&display=block">
<style>
  /* ── Style: tokens only ──────────────────────────────────────────────────────────── */

  /* Night: neutral blacks without a blue tint, white as the only accent, sharp buttons,
     glass cards. */
  :root[data-theme="night"] {
    --font-title: "Manrope", system-ui, sans-serif;
    --font-text: "Roboto", system-ui, sans-serif;
    --title-weight: 800;
    --title-tracking: -0.045em;

    --bg: #0a0a0a;
    --bg-alt: #0d0d0d;
    --panel: #171717;
    --text: #ffffff;
    --secondary: #a3a3a3;
    --dim: #737373;
    --line: #262626;
    --line-strong: #404040;
    --accent: #ffffff;
    --on-accent: #0a0a0a;
    --ghost-word: rgb(255 255 255 / 0.055);
    --glass: rgb(255 255 255 / 0.035);
    --glass-hover: rgb(255 255 255 / 0.06);
    --glass-line: rgb(255 255 255 / 0.09);
    --glass-blur: 14px;
    --spot: rgb(255 255 255 / 0.09);
    --grid-line: rgb(255 255 255 / 0.05);
    --glow: rgb(255 255 255 / 0.10);
    --header-bg: rgb(10 10 10 / 0.72);
    --highlight: #a3a3a3;

    --radius-button: 0;
    --radius-card: 10px;
    --radius-chip: 999px;
  }

  :root[data-text="open-sans"] { --font-text: "Open Sans", system-ui, sans-serif; }
  :root[data-text="google-sans"] { --font-text: "Google Sans", system-ui, sans-serif; }
  :root[data-text="alegreya-sans"] { --font-text: "Alegreya Sans", system-ui, sans-serif; }

  /* ── Base ──────────────────────────────────────────────────────────────────────── */

  :root {
    --gutter: clamp(20px, 5vw, 80px);
    --width: 1200px;
    --header-height: 76px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html[data-motion="off"] { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 17px/1.6 var(--font-text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img, svg, canvas { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .app-skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--accent); color: var(--on-accent); }
  .app-skip:focus { top: 12px; }
  .app-wrap { width: min(100% - 2 * var(--gutter), var(--width)); margin-inline: auto; }
  .app-lead { margin: 0; max-width: 58ch; color: var(--secondary); font-size: 18px; text-wrap: pretty; }
  .app-highlight { color: var(--highlight); }
  .app-section { position: relative; padding-block: clamp(80px, 11vw, 140px); }

  /* The logo: the mark and the wordmark, in the proportions of the charter (gap one third of
     the mark, letters half of it). */
  .app-logo { --logo-height: 34px; display: flex; align-items: center; gap: calc(var(--logo-height) / 3); color: var(--text); }
  .app-logo .app-mark { height: var(--logo-height); width: auto; }
  .app-logo .app-wordmark { height: calc(var(--logo-height) * 0.5 * 0.728); width: auto; }

  /* Section heading, after the former site: a title over a large faded word. */
  .app-heading { position: relative; margin-bottom: clamp(36px, 5vw, 64px); padding-top: clamp(14px, 2.2vw, 30px); }
  .app-heading-ghost {
    display: block;
    margin-left: 0.12em;
    font: 800 clamp(58px, 13vw, 176px)/0.8 var(--font-title);
    letter-spacing: -0.06em;
    text-transform: uppercase;
    color: var(--ghost-word);
    white-space: nowrap;
    user-select: none;
  }
  .app-heading-title {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    font: var(--title-weight) clamp(32px, 5.4vw, 68px)/1 var(--font-title);
    letter-spacing: var(--title-tracking);
    text-transform: uppercase;
  }
  .app-heading + .app-lead { margin-top: calc(-1 * clamp(12px, 2vw, 32px)); margin-bottom: clamp(36px, 5vw, 56px); }

  /* Buttons: white and sharp, or outlined. */
  .app-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 26px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-button);
    background: var(--accent);
    color: var(--on-accent);
    font: 700 15px/1 var(--font-title);
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: box-shadow .35s, background-color .3s, border-color .3s, color .3s;
    will-change: transform;
  }
  .app-button:hover { box-shadow: 0 14px 40px -12px rgb(255 255 255 / .35); }
  .app-button.is-outline { background: transparent; color: var(--text); border-color: var(--line-strong); }
  .app-button.is-outline:hover { border-color: var(--text); box-shadow: none; }
  .app-link { font: 700 15px/1.2 var(--font-title); border-bottom: 1px solid var(--line-strong); padding-bottom: 4px; transition: border-color .3s; }
  .app-link:hover { border-color: var(--text); }

  /* Glass: a translucent panel that blurs what lies behind it. */
  .app-glass {
    border: 1px solid var(--glass-line);
    border-radius: var(--radius-card);
    background-color: var(--glass);
    backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
  }
  /* Soft white lights behind a group of glass cards, so that the glass has something to blur. */
  .app-lights { position: absolute; inset: 0; pointer-events: none; }
  .app-lights i { position: absolute; width: 38vw; height: 38vw; max-width: 520px; max-height: 520px; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / .09), transparent 65%); }

  /* ── Header ─────────────────────────────────────────────────────────────────────── */

  .app-header {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: var(--header-height);
    border-bottom: 1px solid transparent;
    transition: background-color .35s, border-color .35s, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .app-header.is-scrolled { background: var(--header-bg); border-color: var(--line); backdrop-filter: blur(16px) saturate(1.3); }
  .app-header.is-hidden { transform: translateY(-100%); }
  .app-header .app-wrap { display: flex; align-items: center; height: 100%; gap: 28px; }
  .app-nav { display: none; margin-left: auto; gap: 32px; }
  .app-nav a { position: relative; font: 600 15px/1 var(--font-title); color: var(--secondary); transition: color .3s; }
  .app-nav a:hover { color: var(--text); }
  .app-nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: var(--text); transform: scaleX(0); transform-origin: right; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .app-nav a:hover::after { transform: scaleX(1); transform-origin: left; }
  .app-header .app-button { margin-left: auto; padding: 12px 18px; font-size: 14px; }
  .app-burger { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; color: var(--text); cursor: pointer; }
  @media (min-width: 900px) {
    .app-nav { display: flex; }
    .app-header .app-button { margin-left: 0; }
    .app-burger { display: none; }
  }

  /* Mobile menu */
  .app-menu {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: flex;
    flex-direction: column;
    padding: calc(var(--header-height) + 24px) var(--gutter) 32px;
    background: var(--bg);
    visibility: hidden;
    clip-path: circle(0 at calc(100% - 40px) 38px);
    transition: clip-path .7s cubic-bezier(.7,0,.2,1), visibility 0s .7s;
  }
  .app-menu.is-open { visibility: visible; clip-path: circle(150% at calc(100% - 40px) 38px); transition: clip-path .7s cubic-bezier(.7,0,.2,1); }
  .app-menu-link { padding: 16px 0; border-bottom: 1px solid var(--line); font: 800 40px/1.05 var(--font-title); letter-spacing: var(--title-tracking); text-transform: uppercase; }
  .app-menu .app-button { align-self: stretch; margin-top: 32px; }
  .app-menu-motto { margin-top: auto; color: var(--dim); font: italic 400 15px/1.4 var(--font-text); }
  .app-header.is-menu { background: transparent; border-color: transparent; backdrop-filter: none; z-index: 46; }

  /* ── Hero ──────────────────────────────────────────────────────────────────────── */

  .app-hero {
    position: relative;
    overflow: hidden;
    padding: calc(var(--header-height) + 40px) 0 56px;
    background: radial-gradient(55% 50% at 78% 45%, var(--glow), transparent 70%), var(--bg);
  }
  .app-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(80% 70% at 70% 40%, #000 30%, transparent 75%);
  }
  .app-hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .app-hero .app-wrap { position: relative; display: grid; gap: 8px; }
  .app-hero-text { position: relative; z-index: 2; }
  .app-hero-title {
    margin: 0;
    font: var(--title-weight) clamp(44px, 6.8vw, 92px)/0.98 var(--font-title);
    letter-spacing: var(--title-tracking);
    text-wrap: balance;
  }
  .app-hero-sub { margin: 28px 0 0; max-width: 52ch; color: var(--secondary); font-size: clamp(17px, 1.5vw, 19px); text-wrap: pretty; }
  .app-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .app-hero-motto { display: flex; align-items: center; gap: 14px; margin: 40px 0 0; color: var(--dim); font: italic 400 16px/1 var(--font-text); }
  .app-hero-motto::before { content: ""; width: 40px; height: 1px; background: currentColor; }
  .app-hero-visual { position: relative; height: 380px; cursor: grab; touch-action: pan-y; }
  .app-hero-visual:active { cursor: grabbing; }
  @media (min-width: 900px) {
    .app-hero { min-height: min(100svh, 880px); display: grid; align-items: center; padding-bottom: 72px; }
    .app-hero .app-wrap { grid-template-columns: 7fr 5fr; align-items: center; }
    .app-hero-visual { height: 540px; }
  }

  /* ── Partners ───────────────────────────────────────────────────────────────────── */

  .app-partner-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; margin: 0; padding: 0; list-style: none; }
  .app-partner-list li { display: grid; place-items: center; height: 88px; }
  .app-partner-list img { max-width: 100%; max-height: 46px; width: auto; height: auto; opacity: .82; transition: opacity .3s; }
  .app-partner-list li:hover img { opacity: 1; }
  .app-partner-list li:last-child { grid-column: 1 / -1; }
  .app-partner-name { font: 800 21px/1 var(--font-title); letter-spacing: -0.04em; text-transform: uppercase; opacity: .82; transition: opacity .3s; }
  .app-partner-list li:hover .app-partner-name { opacity: 1; }
  @media (min-width: 760px) {
    .app-partner-list { grid-template-columns: repeat(5, 1fr); }
    .app-partner-list li { height: 100px; }
    .app-partner-list li:last-child { grid-column: auto; }
  }

  /* ── Cards: audiences and domains ────────────────────────────────────────────────── */

  .app-cards { position: relative; display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 640px) { .app-cards.is-domains { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .app-cards.is-audiences { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1100px) { .app-cards.is-domains { grid-template-columns: repeat(4, 1fr); } }
  .app-card {
    --mx: 50%;
    --my: 50%;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 26px;
    overflow: hidden;
    background-image: radial-gradient(380px circle at var(--mx) var(--my), var(--spot), transparent 50%);
    transition: border-color .35s, background-color .35s;
  }
  .app-card:hover { border-color: rgb(255 255 255 / .22); background-color: var(--glass-hover); }
  .app-card h3 { margin: 0; font: 700 21px/1.2 var(--font-title); letter-spacing: -0.025em; }
  .app-card p { margin: 0; color: var(--secondary); font-size: 15.5px; line-height: 1.55; }
  .app-card-icon { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--glass-line); border-radius: 50%; color: var(--text); background: rgb(255 255 255 / .04); }
  .app-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; padding: 0; list-style: none; }
  .app-chips li { padding: 6px 10px; border: 1px solid var(--glass-line); border-radius: var(--radius-chip); font: 600 12px/1 var(--font-title); color: var(--secondary); }
  .app-new { align-self: flex-start; padding: 6px 10px; background: var(--accent); color: var(--on-accent); font: 800 11px/1 var(--font-title); letter-spacing: .1em; text-transform: uppercase; }
  /* "Voir les modules": a white band across the bottom of the card; the whole card is the link. */
  .app-card-more {
    display: block;
    margin: auto -26px -28px;
    padding: 16px;
    background: var(--accent);
    color: var(--on-accent);
    text-align: center;
    font: 700 15px/1 var(--font-title);
    transition: padding .35s;
  }
  .app-card-more::after { content: ""; position: absolute; inset: 0; }
  .app-card:hover .app-card-more { padding-block: 19px; }
  .app-card.is-custom { border-style: dashed; justify-content: center; background-color: transparent; }
  .app-card.is-custom h3 { font-size: 24px; }
  .app-card.is-custom p { margin-bottom: 18px; }
  .app-card.is-custom .app-card-more { background: transparent; color: var(--text); border-top: 1px dashed var(--glass-line); }


  /* ── Pedagogy ───────────────────────────────────────────────────────────────────── */

  .app-steps { display: grid; gap: 44px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 640px) { .app-steps { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .app-steps { grid-template-columns: repeat(4, 1fr); gap: 32px; } }
  .app-step-number { font: 200 64px/1 var(--font-title); letter-spacing: -0.05em; }
  .app-step-rule { position: relative; height: 1px; margin: 20px 0 22px; overflow: hidden; background: var(--line); }
  .app-step-rule::after { content: ""; position: absolute; inset: 0; background: var(--text); transform: scaleX(var(--progress, 1)); transform-origin: left; }
  .app-steps h3 { margin: 0; font: 700 22px/1.2 var(--font-title); letter-spacing: -0.025em; }
  .app-steps p { margin: 10px 0 0; color: var(--secondary); font-size: 16px; }

  /* ── About ──────────────────────────────────────────────────────────────────────── */

  .app-about-grid { display: grid; gap: 40px; align-items: center; }
  @media (min-width: 900px) { .app-about-grid { grid-template-columns: 5fr 7fr; gap: 72px; } }
  .app-portrait { position: relative; aspect-ratio: 4 / 5; overflow: hidden; color: var(--text); background: repeating-linear-gradient(-49.5deg, transparent 0 22px, var(--grid-line) 22px 23px), radial-gradient(70% 70% at 30% 20%, rgb(255 255 255 / .07), transparent 70%), var(--panel); }
  .app-portrait .app-mark { position: absolute; left: 50%; top: 50%; height: 34%; width: auto; transform: translate(-50%, -50%); opacity: .9; }
  .app-portrait span { position: absolute; left: 18px; bottom: 16px; color: var(--dim); font: italic 400 13px/1 var(--font-text); }
  .app-about-name { margin: 0; font: 800 clamp(30px, 3.6vw, 46px)/1.05 var(--font-title); letter-spacing: var(--title-tracking); }
  .app-about-grid .app-lead { margin-top: 18px; }
  .app-figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0; padding: 24px 0; border-block: 1px solid var(--line); }
  .app-figures strong { display: block; font: 800 clamp(28px, 4vw, 44px)/1 var(--font-title); letter-spacing: -0.05em; }
  .app-figures div > span { display: block; margin-top: 8px; color: var(--secondary); font-size: 14px; line-height: 1.35; }

  /* ── Call to action ─────────────────────────────────────────────────────────────── */

  .app-cta { position: relative; overflow: hidden; padding-block: clamp(90px, 12vw, 160px); background: var(--bg-alt); border-top: 1px solid var(--line); text-align: center; }
  .app-cta::before { content: ""; position: absolute; inset: -50%; background: conic-gradient(from var(--angle, 0deg) at 50% 50%, transparent 0 70%, var(--glow) 80%, transparent 90%); animation: app-spin 16s linear infinite; }
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes app-spin { to { --angle: 360deg; } }
  html[data-motion="off"] .app-cta::before { animation: none; }
  .app-cta .app-wrap { position: relative; display: grid; justify-items: center; }
  .app-cta-ghost { position: absolute; left: 50%; top: 50%; translate: -50% -58%; font: 800 clamp(80px, 19vw, 280px)/0.8 var(--font-title); letter-spacing: -0.06em; text-transform: uppercase; color: var(--ghost-word); white-space: nowrap; pointer-events: none; }
  .app-cta h2 { position: relative; max-width: 16ch; margin: 0; font: var(--title-weight) clamp(38px, 6vw, 76px)/1 var(--font-title); letter-spacing: var(--title-tracking); text-wrap: balance; }
  .app-cta p { position: relative; margin: 22px 0 34px; color: var(--secondary); }

  /* ── Footer ─────────────────────────────────────────────────────────────────────── */

  .app-footer {
    position: relative;
    overflow: hidden;
    padding: clamp(56px, 8vw, 96px) 0 28px;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    border-top: 1px solid var(--line);
  }
  .app-footer-logo { display: flex; align-items: flex-end; gap: clamp(14px, 2.5vw, 36px); margin-bottom: clamp(40px, 6vw, 72px); color: var(--text); }
  .app-footer-logo .app-mark { height: clamp(64px, 14vw, 190px); width: auto; flex: none; }
  .app-footer-logo .app-wordmark { width: min(100%, 980px); height: auto; overflow: visible; }
  .app-footer-grid { display: grid; gap: 32px; }
  @media (min-width: 900px) { .app-footer-grid { grid-template-columns: 4fr 3fr 3fr 3fr; } }
  .app-footer h2 { margin: 0 0 16px; font: 800 12px/1 var(--font-title); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .app-footer ul { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .app-footer li, .app-footer p { margin: 0; color: var(--secondary); font-size: 15px; }
  .app-footer a { transition: color .3s; }
  .app-footer a:hover { color: var(--text); }
  .app-footer .app-footer-motto { margin-bottom: 8px; color: var(--text); font: italic 400 19px/1.4 var(--font-text); }
  .app-footer-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }

  /* ── Motion: the starting state of the reveals, only when the animations run ──────── */

  html[data-motion="on"].is-js .app-reveal { opacity: 0; transform: translateY(36px); }
  html[data-motion="on"].is-js .app-intro { visibility: hidden; }
  html:not(.is-js) .app-intro { visibility: visible !important; }
</style>
</head>
<body>
<a class="app-skip" href="#content">Aller au contenu</a>

<header class="app-header" id="header">
  <div class="app-wrap">
    <a class="app-logo" href="#" aria-label="Sylent, accueil" data-logo></a>
    <nav class="app-nav" aria-label="Navigation principale">
      <a href="#formations">Formations</a><a href="#">Articles</a><a href="#a-propos">À propos</a><a href="#contact">Contact</a>
    </nav>
    <a class="app-button app-magnetic" href="#contact">Me contacter</a>
    <button class="app-burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Ouvrir le menu" id="burger"></button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script type="module">
  import * as THREE from "three";

  const root = document.documentElement;
  const motion = root.dataset.motion === "on";
  const shot = location.search.includes("shot");
  const css = name => getComputedStyle(root).getPropertyValue(name).trim();
  gsap.registerPlugin(ScrollTrigger, SplitText);

  // ── Header: solid once the page scrolls, hidden while scrolling down ──────────────────
  const header = document.getElementById("header");
  let lastY = 0;
  addEventListener("scroll", () => {
    const y = scrollY;
    header.classList.toggle("is-scrolled", y > 20);
    if (!header.classList.contains("is-menu")) header.classList.toggle("is-hidden", y > 400 && y > lastY);
    lastY = y;
  }, { passive: true });

  // ── Mobile menu ───────────────────────────────────────────────────────────────────
  const menu = document.getElementById("menu");
  const burger = document.getElementById("burger");
  function toggleMenu(open = !menu.classList.contains("is-open")) {
    menu.classList.toggle("is-open", open);
    header.classList.toggle("is-menu", open);
    menu.setAttribute("aria-hidden", String(!open));
    burger.setAttribute("aria-expanded", String(open));
    burger.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
    burger.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="${open ? "M6 6l12 12M18 6L6 18" : "M4 8h16M4 16h16"}"/></svg>`;
    document.body.style.overflow = open ? "hidden" : "";
    if (open && motion) gsap.fromTo(menu.querySelectorAll(".app-menu-link, .app-button"), { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.06, duration: 0.7, delay: 0.2, ease: "expo.out" });
  }
  burger.addEventListener("click", () => toggleMenu());
  menu.addEventListener("click", event => { if (event.target.closest("a")) toggleMenu(false); });
  addEventListener("keydown", event => { if (event.key === "Escape" && menu.classList.contains("is-open")) { toggleMenu(false); burger.focus(); } });

  // ── The cube: one quality or one figure on each face ───────────────────────────────
  const FACES = [
    ["Le sens", "Pourquoi ?"],
    ["Par an depuis 2023", "900+ h"],
    ["Pas à pas", "Patience"],
    ["Formateur depuis", "2021"],
    ["En toute sérénité", "Bienveillance"],
    ["Écoles et organismes", "5"],
  ];
  const canvas = document.getElementById("cube-canvas");
  const area = document.getElementById("cube-area");
  const hero = document.getElementById("hero");
  let renderer;
  try {
    // Without motion, one frame is drawn: keep it, so that it survives the compositing.
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: !motion || shot });
  } catch {
    canvas.remove();
  }

  if (renderer) {
    const family = css("--font-title");
    await Promise.all([document.fonts.load(`800 120px ${family}`), document.fonts.load(`700 24px ${family}`)]);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 14);

    function faceTexture([small, big]) {
      const size = 512;
      const paint = document.createElement("canvas");
      paint.width = paint.height = size;
      const g = paint.getContext("2d");
      g.fillStyle = "#111111";
      g.fillRect(0, 0, size, size);
      g.strokeStyle = "rgba(255, 255, 255, 0.06)";
      for (let x = 0; x <= size; x += 32) {
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, size); g.stroke();
        g.beginPath(); g.moveTo(0, x); g.lineTo(size, x); g.stroke();
      }
      g.fillStyle = "#a3a3a3";
      g.font = `700 24px ${family}`;
      g.letterSpacing = "4px";
      g.textBaseline = "top";
      g.fillText(small.toUpperCase(), 48, 52);
      g.letterSpacing = "-4px";
      g.fillStyle = "#ffffff";
      let fontSize = 160;
      do { g.font = `800 ${fontSize}px ${family}`; fontSize -= 4; } while (g.measureText(big).width > size - 96);
      g.textBaseline = "alphabetic";
      g.fillText(big, 44, size - 70);
      g.fillRect(48, size - 50, 72, 8);
      const texture = new THREE.CanvasTexture(paint);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const white = new THREE.Color("#ffffff");
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const cube = new THREE.Mesh(geometry, FACES.map(face => new THREE.MeshBasicMaterial({ map: faceTexture(face), transparent: true, opacity: 0.95 })));
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: white, transparent: true, opacity: 0.9 })));
    const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.7, 2.7, 2.7)), new THREE.LineBasicMaterial({ color: white, transparent: true, opacity: 0.16 }));
    const rig = new THREE.Group();
    rig.add(cube, shell);
    scene.add(rig);

    // Place the cube on the visual area of the hero, whatever the layout.
    function layout() {
      const box = hero.getBoundingClientRect();
      const spot = area.getBoundingClientRect();
      renderer.setSize(box.width, box.height, false);
      camera.aspect = box.width / box.height;
      camera.updateProjectionMatrix();
      const height = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      const unit = height / box.height;
      rig.position.x = (spot.left + spot.width / 2 - box.left - box.width / 2) * unit;
      rig.position.y = -(spot.top + spot.height / 2 - box.top - box.height / 2) * unit + 0.2;
      rig.scale.setScalar(Math.min(spot.width, spot.height) * unit / (box.width < 900 ? 3.9 : 4.6));
    }
    new ResizeObserver(layout).observe(hero);
    layout();

    // Rotation: a slow idle turn, the pointer tilts it, a drag spins it with inertia, and the
    // scroll turns it a little more.
    const state = { x: -0.45, y: 0.65, vx: 0, vy: 0.0035, tiltX: 0, tiltY: 0, scroll: 0, scale: motion ? 0 : 1 };
    let drag = null;
    area.addEventListener("pointerdown", event => { drag = { x: event.clientX, y: event.clientY }; area.setPointerCapture(event.pointerId); });
    area.addEventListener("pointermove", event => {
      if (!drag) return;
      state.vy = (event.clientX - drag.x) * 0.0035;
      state.vx = (event.clientY - drag.y) * 0.0035;
      drag = { x: event.clientX, y: event.clientY };
    });
    area.addEventListener("pointerup", () => { drag = null; });
    hero.addEventListener("pointermove", event => {
      const box = hero.getBoundingClientRect();
      state.tiltY = ((event.clientX - box.left) / box.width - 0.5) * 0.5;
      state.tiltX = ((event.clientY - box.top) / box.height - 0.5) * 0.4;
    });

    let visible = true;
    new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(hero);
    const clock = new THREE.Clock();
    function frame() {
      const time = clock.getElapsedTime();
      if (motion) {
        state.y += state.vy;
        state.x += state.vx;
        if (!drag) { state.vy += (0.0035 - state.vy) * 0.02; state.vx *= 0.94; }
        shell.rotation.x = -time * 0.15;
        shell.rotation.y = time * 0.11;
      }
      cube.rotation.x = state.x + state.tiltX + state.scroll * 0.6;
      cube.rotation.y = state.y + state.tiltY + state.scroll * 1.4;
      cube.scale.setScalar(state.scale);
      renderer.render(scene, camera);
      // Headless screenshots don't show WebGL: ?shot=1 copies the first frame into an image.
      if (shot && !frame.done) { frame.done = true; const copy = new Image(); copy.src = canvas.toDataURL(); copy.className = "app-hero-canvas"; canvas.after(copy); }
    }
    if (motion) {
      renderer.setAnimationLoop(() => { if (visible) frame(); });
      gsap.to(state, { scale: 1, duration: 1.6, delay: 0.5, ease: "elastic.out(1, 0.6)" });
      gsap.to(state, { scroll: 1, ease: "none", scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: 0.6 } });
      gsap.to(canvas, { yPercent: 18, autoAlpha: 0.2, ease: "none", scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: true } });
    } else {
      frame();
      new ResizeObserver(frame).observe(hero);
    }
  }

  // ── Animations ────────────────────────────────────────────────────────────────────
  if (motion) {
    window.sylentIntro = true;
    // Intro: the title rises line by line from behind a mask.
    const split = SplitText.create(".app-hero-title", { type: "lines", mask: "lines" });
    gsap.set(".app-intro", { visibility: "visible" });
    gsap.timeline({ defaults: { ease: "expo.out", duration: 1.1 } })
      .from(header, { yPercent: -100, duration: 0.9 })
      .from(split.lines, { yPercent: 110, stagger: 0.09, duration: 1.2 }, "-=0.5")
      .from([".app-hero-sub", ".app-hero-actions", ".app-hero-motto"], { y: 28, autoAlpha: 0, stagger: 0.1 }, "-=0.8");

    // Reveals on scroll, in small batches.
    ScrollTrigger.batch(".app-reveal", {
      start: "top 88%",
      onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, stagger: 0.08, duration: 1, ease: "power3.out", overwrite: true }),
    });

    // Section headings, as on the former site: the title rises, the large word behind it
    // slides as the page scrolls.
    document.querySelectorAll(".app-heading").forEach(block => {
      const title = block.querySelector(".app-heading-title");
      SplitText.create(title, { type: "words", mask: "words", onSplit: self => gsap.from(self.words, { yPercent: 100, stagger: 0.05, duration: 1, ease: "expo.out", scrollTrigger: { trigger: block, start: "top 86%" } }) });
      gsap.fromTo(block.querySelector(".app-heading-ghost"), { xPercent: 6 }, { xPercent: -4, ease: "none", scrollTrigger: { trigger: block, start: "top bottom", end: "bottom top", scrub: true } });
    });
    gsap.fromTo(".app-cta-ghost", { xPercent: 8 }, { xPercent: -8, ease: "none", scrollTrigger: { trigger: ".app-cta", start: "top bottom", end: "bottom top", scrub: true } });

    // The rules of the pedagogy draw themselves as the section scrolls.
    gsap.utils.toArray(".app-step-rule").forEach((rule, index) => {
      gsap.fromTo(rule, { "--progress": 0 }, { "--progress": 1, ease: "none", scrollTrigger: { trigger: ".app-steps", start: `top ${80 - index * 6}%`, end: `top ${40 - index * 6}%`, scrub: true } });
    });

    // The figures count up.
    gsap.utils.toArray(".app-count").forEach(counter => {
      const value = { n: Number(counter.dataset.from || 0) };
      gsap.to(value, { n: Number(counter.dataset.to), duration: 2, ease: "power2.out", scrollTrigger: { trigger: counter, start: "top 92%" }, onUpdate: () => { counter.textContent = Math.round(value.n); } });
    });

    // Pointer devices: the cards tilt and light up under the pointer, the main buttons are
    // magnetic.
    if (matchMedia("(hover: hover)").matches) {
      document.querySelectorAll(".app-tilt").forEach(card => {
        const rotateX = gsap.quickTo(card, "rotationX", { duration: 0.6, ease: "power3" });
        const rotateY = gsap.quickTo(card, "rotationY", { duration: 0.6, ease: "power3" });
        gsap.set(card, { transformPerspective: 900 });
        card.addEventListener("pointermove", event => {
          const box = card.getBoundingClientRect();
          const x = (event.clientX - box.left) / box.width, y = (event.clientY - box.top) / box.height;
          card.style.setProperty("--mx", `${x * 100}%`);
          card.style.setProperty("--my", `${y * 100}%`);
          rotateY((x - 0.5) * 7);
          rotateX((0.5 - y) * 7);
        });
        card.addEventListener("pointerleave", () => { rotateX(0); rotateY(0); });
      });
      document.querySelectorAll(".app-magnetic").forEach(button => {
        const moveX = gsap.quickTo(button, "x", { duration: 0.5, ease: "power3" });
        const moveY = gsap.quickTo(button, "y", { duration: 0.5, ease: "power3" });
        button.addEventListener("pointermove", event => {
          const box = button.getBoundingClientRect();
          moveX((event.clientX - box.left - box.width / 2) * 0.3);
          moveY((event.clientY - box.top - box.height / 2) * 0.4);
        });
        button.addEventListener("pointerleave", () => { moveX(0); moveY(0); });
      });
    }
  } else {
    document.querySelectorAll(".app-intro").forEach(element => { element.style.visibility = "visible"; });
  }
</script>
</body>
</html>
