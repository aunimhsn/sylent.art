<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylent · Formateur en informatique</title>
<meta name="description" content="Formateur en informatique depuis 2021 : développement, bases de données, tests, Python et IA, pour les écoles, les organismes de formation et les entreprises.">
<!--
  The home page of sylent.art (mock-up, step 4 of roadmap.md), shown at phone and desktop width
  by home.html; open it alone to see it at the width of the window.
  ?motion=off shows the page without animations, as for a visitor who asked their system to
  reduce motion; ?shot=1 copies the 3D scene into an image, since headless screenshots don't
  show WebGL.

  Layout: set 1 of docs/wireframes (home.excalidraw). The style only sets tokens (CSS variables
  under :root[data-theme="…"]); the components use nothing else.
  Brand: the mark and the SYLENT wordmark (Montserrat 800, -0.195 em, drawn as a path so that
  the site loads no third font) follow the charter of sylent-slides. The section headings take
  up the principle of the former site: a title over a large faded word (Partenaires over
  Confiance).
  Fonts: Manrope (titles, interface) and Anaheim medium (text; it has no italic, so the browser
  slants it), from Google Fonts here, self-hosted by
  the site. Three.js and GSAP come from jsDelivr here; the site will bundle them.
  The texts are sample content close to specs.md; the photo is still to come and the logo of
  IGENSIA Tech is missing.
-->
<script>
  // The motion is chosen before the first paint, so that nothing flashes.
  const query = new URLSearchParams(location.search);
  const reduced = query.get("motion") === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.dataset.motion = reduced ? "off" : "on";
  // ?debug=1 shows the script errors in a red band at the top of the page.
  if (query.has("debug")) { const show = text => document.body.insertAdjacentHTML("afterbegin", `<pre style="position:fixed;z-index:999;top:0;left:0;right:0;white-space:pre-wrap;background:#c00;color:#fff;font:14px monospace">${text}</pre>`); addEventListener("error", e => show(e.message + " " + e.filename + ":" + e.lineno)); addEventListener("unhandledrejection", e => show("rejection " + (e.reason && e.reason.stack || e.reason))); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500&display=block">
<style>
  /* ── Style: tokens only ──────────────────────────────────────────────────────────── */

  /* Night: neutral blacks without a blue tint, white as the only accent, sharp buttons,
     glass cards. */
  :root[data-theme="night"] {
    --font-title: "Manrope", system-ui, sans-serif;
    --font-text: "Anaheim", system-ui, sans-serif;
    --text-weight: 500;
    --title-weight: 800;
    --title-tracking: -0.045em;

    --bg: #0a0a0a;
    --bg-alt: #0d0d0d;
    --panel: #171717;
    --text: #ffffff;
    --secondary: #a3a3a3;
    --dim: #737373;
    --line: #262626;
    --line-strong: #404040;
    --accent: #ffffff;
    --on-accent: #0a0a0a;
    --signal: #d3450e;
    --new-bg: var(--signal);
    --new-text: #ffffff;
    --ghost-word: #181818;
    --glass: rgb(255 255 255 / 0.035);
    --glass-hover: rgb(255 255 255 / 0.06);
    --glass-line: rgb(255 255 255 / 0.09);
    --glass-blur: 14px;
    --spot: rgb(255 255 255 / 0.09);
    --grid-line: rgb(255 255 255 / 0.05);
    --glow: rgb(255 255 255 / 0.10);
    --header-bg: rgb(10 10 10 / 0.72);
    --highlight: #a3a3a3;

    --radius-button: 0;
    --radius-card: 0;
    --radius-chip: 999px;
  }

  /* ── Base ──────────────────────────────────────────────────────────────────────── */

  :root {
    --gutter: clamp(20px, 5vw, 80px);
    --width: 1200px;
    --header-height: 76px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html[data-motion="off"] { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--text-weight) 17px/1.6 var(--font-text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img, svg, canvas { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .app-skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--accent); color: var(--on-accent); }
  .app-skip:focus { top: 12px; }
  .app-wrap { width: min(100% - 2 * var(--gutter), var(--width)); margin-inline: auto; }
  /* The motto, after a short rule: in the hero, the footer and the mobile menu. */
  .app-motto { display: flex; align-items: center; gap: 14px; margin: 0; color: var(--dim); font: var(--text-weight) 16px/1 var(--font-text); }
  .app-motto::before { content: ""; width: 40px; height: 1px; background: currentColor; }
  .app-lead { margin: 0; max-width: 58ch; color: var(--secondary); font-size: 18px; text-wrap: pretty; }
  .app-highlight { color: var(--highlight); }
  .app-section { position: relative; padding-block: clamp(80px, 11vw, 140px); }

  /* The logo: the mark and the wordmark, in the proportions of the charter (gap one third of
     the mark, letters half of it). */
  .app-logo { --logo-height: 34px; display: flex; align-items: center; gap: calc(var(--logo-height) / 3); color: var(--text); }
  .app-logo .app-mark { height: var(--logo-height); width: auto; }
  .app-logo .app-wordmark { height: calc(var(--logo-height) * 0.5 * 0.728); width: auto; }

  /* Section heading, after the former site: a title over a large faded word. */
  .app-heading { position: relative; margin-bottom: clamp(36px, 5vw, 64px); padding-top: clamp(14px, 2.2vw, 30px); }
  .app-heading-ghost {
    display: block;
    margin-left: 0.12em;
    font: 800 clamp(58px, 13vw, 176px)/0.8 var(--font-title);
    letter-spacing: -0.06em;
    text-transform: uppercase;
    color: var(--ghost-word);
    white-space: nowrap;
    user-select: none;
  }
  .app-heading-title {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    font: var(--title-weight) clamp(32px, 5.4vw, 68px)/1 var(--font-title);
    letter-spacing: var(--title-tracking);
    text-transform: uppercase;
  }
  .app-heading + .app-lead { margin-top: calc(-1 * clamp(12px, 2vw, 32px)); margin-bottom: clamp(36px, 5vw, 56px); }

  /* Buttons: white and sharp, or outlined. */
  .app-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 26px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-button);
    background: var(--accent);
    color: var(--on-accent);
    font: 700 15px/1 var(--font-title);
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background-color .3s, border-color .3s, color .3s;
    will-change: transform;
  }
  .app-button.is-outline { background: transparent; color: var(--text); border-color: var(--line-strong); }
  .app-button.is-outline:hover { border-color: var(--text); }
  .app-link { font: 700 15px/1.2 var(--font-title); border-bottom: 1px solid var(--line-strong); padding-bottom: 4px; transition: border-color .3s; }
  .app-link:hover { border-color: var(--text); }

  /* Glass: a translucent panel that blurs what lies behind it. */
  .app-glass {
    border: 1px solid var(--glass-line);
    border-radius: var(--radius-card);
    background-color: var(--glass);
    backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
  }

  /* ── Header ─────────────────────────────────────────────────────────────────────── */

  .app-header {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: var(--header-height);
    border-bottom: 1px solid transparent;
    transition: background-color .35s, border-color .35s, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .app-header.is-scrolled { background: var(--header-bg); border-color: var(--line); backdrop-filter: blur(16px) saturate(1.3); }
  .app-header.is-hidden { transform: translateY(-100%); }
  .app-header .app-wrap { display: flex; align-items: center; height: 100%; gap: 28px; }
  .app-nav { display: none; margin-left: auto; gap: 32px; }
  .app-nav a { position: relative; font: 600 15px/1 var(--font-title); color: var(--secondary); transition: color .3s; }
  .app-nav a:hover { color: var(--text); }
  .app-nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: var(--text); transform: scaleX(0); transform-origin: right; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .app-nav a:hover::after { transform: scaleX(1); transform-origin: left; }
  .app-header .app-button { margin-left: auto; padding: 12px 18px; font-size: 14px; }
  .app-burger { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; color: var(--text); cursor: pointer; }
  @media (min-width: 900px) {
    .app-nav { display: flex; }
    .app-header .app-button { margin-left: 0; }
    .app-burger { display: none; }
  }

  /* Mobile menu */
  .app-menu {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: flex;
    flex-direction: column;
    padding: calc(var(--header-height) + 24px) var(--gutter) 32px;
    background: var(--bg);
    visibility: hidden;
    clip-path: circle(0 at calc(100% - 40px) 38px);
    transition: clip-path .7s cubic-bezier(.7,0,.2,1), visibility 0s .7s;
  }
  .app-menu.is-open { visibility: visible; clip-path: circle(150% at calc(100% - 40px) 38px); transition: clip-path .7s cubic-bezier(.7,0,.2,1); }
  .app-menu-link { padding: 16px 0; border-bottom: 1px solid var(--line); font: 800 40px/1.05 var(--font-title); letter-spacing: var(--title-tracking); text-transform: uppercase; }
  .app-menu .app-button { align-self: stretch; margin-top: 32px; }
  .app-menu .app-motto { margin-top: auto; }
  .app-header.is-menu { background: transparent; border-color: transparent; backdrop-filter: none; z-index: 46; }

  /* ── Hero ──────────────────────────────────────────────────────────────────────── */

  .app-hero {
    position: relative;
    overflow: hidden;
    padding: calc(var(--header-height) + 40px) 0 56px;
    background: radial-gradient(55% 50% at 78% 45%, var(--glow), transparent 70%), var(--bg);
  }
  .app-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(80% 70% at 70% 40%, #000 30%, transparent 75%);
  }
  .app-hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .app-hero .app-wrap { position: relative; display: grid; gap: 8px; }
  .app-hero-text { position: relative; z-index: 2; }
  .app-hero-title {
    margin: 0;
    font: var(--title-weight) clamp(44px, 6.8vw, 92px)/0.98 var(--font-title);
    letter-spacing: var(--title-tracking);
    text-wrap: balance;
  }
  .app-hero-sub { margin: 28px 0 0; max-width: 52ch; color: var(--secondary); font-size: clamp(17px, 1.5vw, 19px); text-wrap: pretty; }
  .app-hero-sub strong { color: var(--text); font-weight: inherit; }
  .app-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .app-hero-motto { margin-top: 40px; }
  .app-hero-visual { position: relative; height: 380px; cursor: grab; touch-action: pan-y; }
  .app-hero-visual:active { cursor: grabbing; }
  @media (min-width: 900px) {
    .app-hero { min-height: min(100svh, 880px); display: grid; align-items: center; padding-bottom: 72px; }
    .app-hero .app-wrap { grid-template-columns: 7fr 5fr; align-items: center; }
    .app-hero-visual { height: 540px; }
  }

  /* ── Partners ───────────────────────────────────────────────────────────────────── */

  /* Logos of equal visual weight: a wide logo is lower, a square one taller (height divided by
     the square root of the proportions). On a phone they sit on the corners of a pentagon, over
     a faint spider chart; from 760 px they line up in one row. */
  .app-partners-map { position: relative; aspect-ratio: 1; }
  .app-partner-web { position: absolute; inset: 0; width: 100%; height: 100%; color: rgb(255 255 255 / 0.1); }
  .app-partner-web .app-web-data { fill: rgb(255 255 255 / 0.03); stroke: rgb(255 255 255 / 0.16); }
  .app-partner-list { --logo-size: 50px; position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; }
  .app-partner-list li { position: absolute; left: var(--x); top: var(--y); translate: -50% -50%; display: grid; place-items: center; }
  .app-partner-list li:nth-child(1) { --x: 15.8%; --y: 41.9%; }
  .app-partner-list li:nth-child(2) { --x: 84.2%; --y: 41.9%; }
  .app-partner-list li:nth-child(3) { --x: 28.8%; --y: 82.1%; }
  .app-partner-list li:nth-child(4) { --x: 71.2%; --y: 82.1%; }
  .app-partner-list li:nth-child(5) { --x: 50%; --y: 17%; }
  .app-partner-list img { display: block; max-width: none; height: calc(var(--logo-size) * var(--scale)); width: auto; opacity: .82; transition: opacity .3s; }
  .app-partner-list li:hover img { opacity: 1; }
  .app-partner-name { font: 800 calc(var(--logo-size) * 0.36)/1 var(--font-title); letter-spacing: -0.04em; text-transform: uppercase; white-space: nowrap; opacity: .82; transition: opacity .3s; }
  .app-partner-list li:hover .app-partner-name { opacity: 1; }
  @media (min-width: 760px) {
    .app-partners-map { aspect-ratio: auto; }
    .app-partner-web { display: none; }
    .app-partner-list { --logo-size: 64px; position: static; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 24px; }
    .app-partner-list li { position: static; translate: none; height: 110px; }
    .app-partner-list img { max-width: 100%; }
  }

  /* ── Cards: audiences and domains ────────────────────────────────────────────────── */

  .app-cards { position: relative; display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 640px) { .app-cards.is-domains { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .app-cards.is-domains { grid-template-columns: repeat(4, 1fr); } }
  .app-card {
    --mx: 50%;
    --my: 50%;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 26px;
    overflow: hidden;
    border: 0;
    background-image: radial-gradient(380px circle at var(--mx) var(--my), var(--spot), transparent 50%);
    transition: background-color .35s;
  }
  .app-card:hover { background-color: var(--glass-hover); }
  .app-card h3 { margin: 0; font: 700 21px/1.2 var(--font-title); letter-spacing: -0.025em; }
  .app-card p { margin: 0; color: var(--secondary); font-size: 15.5px; line-height: 1.55; }
  .app-card > p { margin-bottom: 18px; }
  /* Cover: a small 3D scene of the domain, drawn by Three.js, across the top of the card. */
  .app-cover {
    position: relative;
    aspect-ratio: 3 / 2;
    margin: -28px -26px 8px;
    background-color: #101010;
    background-image: linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px);
    background-size: 24px 24px;
    border-bottom: 1px solid rgb(255 255 255 / .06);
  }
  .app-cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .app-new { position: absolute; left: 16px; top: 16px; padding: 6px 10px; background: var(--new-bg); color: var(--new-text); font: 800 11px/1 var(--font-title); letter-spacing: .1em; text-transform: uppercase; }
  /* "Voir les modules": a white band across the bottom of the card; the whole card is the link. */
  .app-card-more {
    display: block;
    margin: auto -26px -28px;
    padding: 16px;
    background: var(--accent);
    color: var(--on-accent);
    text-align: center;
    font: 700 15px/1 var(--font-title);
    transition: padding .35s;
  }
  .app-card-more::after { content: ""; position: absolute; inset: 0; }
  .app-card:hover .app-card-more { padding-block: 19px; }


  /* Audiences: plain columns under a rule. */
  .app-audiences { display: grid; gap: 36px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 900px) { .app-audiences { grid-template-columns: repeat(3, 1fr); gap: 32px; } }
  .app-audiences li { padding-top: 22px; border-top: 1px solid var(--line); }
  .app-audiences h3 { margin: 0; font: 700 22px/1.2 var(--font-title); letter-spacing: -0.025em; }
  .app-audiences p { margin: 10px 0 0; color: var(--secondary); }

  /* ── Pedagogy ───────────────────────────────────────────────────────────────────── */

  .app-steps { display: grid; gap: 44px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 640px) { .app-steps { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .app-steps { grid-template-columns: repeat(4, 1fr); gap: 32px; } }
  .app-step-number { font: 200 64px/1 var(--font-title); letter-spacing: -0.05em; }
  .app-step-rule { position: relative; height: 1px; margin: 20px 0 22px; overflow: hidden; background: var(--line); }
  .app-step-rule::after { content: ""; position: absolute; inset: 0; background: var(--text); transform: scaleX(var(--progress, 1)); transform-origin: left; }
  .app-steps h3 { margin: 0; font: 700 22px/1.2 var(--font-title); letter-spacing: -0.025em; }
  .app-steps p { margin: 10px 0 0; color: var(--secondary); font-size: 16px; }

  /* ── About ──────────────────────────────────────────────────────────────────────── */

  /* No photo for now: the text alone, aligned left. */
  .app-about-grid { max-width: 760px; }
  .app-about-name { margin: 0; font: 800 clamp(30px, 3.6vw, 46px)/1.05 var(--font-title); letter-spacing: var(--title-tracking); }
  .app-about-grid .app-lead { margin-top: 18px; }
  .app-figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0; padding: 24px 0; border-block: 1px solid var(--line); }
  .app-figures strong { display: block; font: 800 clamp(28px, 4vw, 44px)/1 var(--font-title); letter-spacing: -0.05em; }
  .app-figures div > span { display: block; margin-top: 8px; color: var(--secondary); font-size: 14px; line-height: 1.35; }

  /* ── Call to action ─────────────────────────────────────────────────────────────── */

  .app-cta { position: relative; overflow: hidden; padding-block: clamp(90px, 12vw, 160px) clamp(130px, 16vw, 220px); background: var(--bg-alt); border-top: 1px solid var(--line); text-align: center; }
  .app-cta .app-wrap { position: relative; display: grid; justify-items: center; }
  .app-cta-ghost { position: absolute; left: 50%; top: 50%; translate: -50% -58%; font: 800 clamp(80px, 19vw, 280px)/0.8 var(--font-title); letter-spacing: -0.06em; text-transform: uppercase; color: var(--ghost-word); white-space: nowrap; pointer-events: none; }
  .app-cta h2 { position: relative; margin: 0; font: var(--title-weight) clamp(38px, 6vw, 76px)/1 var(--font-title); letter-spacing: var(--title-tracking); text-wrap: balance; }
  .app-cta .app-button { margin-top: 44px; }

  /* ── Footer ─────────────────────────────────────────────────────────────────────── */

  .app-footer {
    --wordmark-width: clamp(220px, 38vw, 490px);
    position: relative;
    /* Room for the lower half of the wordmark, which straddles the top edge. */
    padding: calc(var(--wordmark-width) * 0.119 + clamp(40px, 6vw, 72px)) 0 28px;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    border-top: 1px solid var(--line);
  }
  /* The wordmark straddles the edge between the call to action and the footer. */
  .app-footer-logo { position: absolute; top: 0; left: max(var(--gutter), calc((100% - var(--width)) / 2)); z-index: 2; width: var(--wordmark-width); translate: 0 -50%; color: var(--text); }
  .app-footer-logo .app-wordmark { display: block; width: 100%; height: auto; }
  .app-footer-grid { display: grid; gap: 32px; }
  @media (min-width: 900px) { .app-footer-grid { grid-template-columns: 4fr 3fr 3fr 3fr; } }
  .app-footer h2 { margin: 0 0 16px; font: 800 12px/1 var(--font-title); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .app-footer ul { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .app-footer li, .app-footer p { margin: 0; color: var(--secondary); font-size: 15px; }
  .app-footer a { transition: color .3s; }
  .app-footer a:hover { color: var(--signal); }
  .app-footer .app-motto { margin-bottom: 14px; color: var(--dim); }
  .app-footer .app-footer-bottom { margin-top: 56px; color: var(--dim); font-size: 13px; }

  /* ── Back to the top: a small square in the bottom right corner, once the hero is passed ── */

  .app-top {
    position: fixed;
    right: clamp(16px, 2.5vw, 32px);
    bottom: clamp(16px, 2.5vw, 32px);
    z-index: 35;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 1px solid var(--line-strong);
    background: rgb(10 10 10 / 0.7);
    backdrop-filter: blur(10px);
    color: var(--text);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity .3s, transform .3s, visibility .3s, background-color .25s, color .25s, border-color .25s;
  }
  .app-top.is-visible { opacity: 1; visibility: visible; transform: none; }
  .app-top:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .app-top svg { transition: transform .3s; }
  .app-top:hover svg { transform: translateY(-2px); }

  /* ── Motion: the starting state of the reveals, only when the animations run ──────── */

  html[data-motion="on"].is-js .app-reveal { opacity: 0; transform: translateY(36px); }
  html[data-motion="on"].is-js .app-intro { visibility: hidden; }

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
  import * as THREE from "three";

  const root = document.documentElement;
  const motion = root.dataset.motion === "on";
  const shot = location.search.includes("shot");
  const css = name => getComputedStyle(root).getPropertyValue(name).trim();
  gsap.registerPlugin(ScrollTrigger, SplitText);

  // ── Header: solid once the page scrolls, hidden while scrolling down ──────────────────
  const header = document.getElementById("header");
  let lastY = 0;
  addEventListener("scroll", () => {
    const y = scrollY;
    header.classList.toggle("is-scrolled", y > 20);
    if (!header.classList.contains("is-menu")) header.classList.toggle("is-hidden", y > 400 && y > lastY);
    lastY = y;
  }, { passive: true });

  // ── Mobile menu ───────────────────────────────────────────────────────────────────
  const menu = document.getElementById("menu");
  const burger = document.getElementById("burger");
  function toggleMenu(open = !menu.classList.contains("is-open")) {
    menu.classList.toggle("is-open", open);
    header.classList.toggle("is-menu", open);
    menu.setAttribute("aria-hidden", String(!open));
    burger.setAttribute("aria-expanded", String(open));
    burger.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
    burger.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="${open ? "M6 6l12 12M18 6L6 18" : "M4 8h16M4 16h16"}"/></svg>`;
    document.body.style.overflow = open ? "hidden" : "";
    if (open && motion) gsap.fromTo(menu.querySelectorAll(".app-menu-link, .app-button"), { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.06, duration: 0.7, delay: 0.2, ease: "expo.out" });
  }
  burger.addEventListener("click", () => toggleMenu());
  menu.addEventListener("click", event => { if (event.target.closest("a")) toggleMenu(false); });
  addEventListener("keydown", event => { if (event.key === "Escape" && menu.classList.contains("is-open")) { toggleMenu(false); burger.focus(); } });

  // ── The cube: one quality or one figure on each face ───────────────────────────────
  const FACES = [
    ["Le sens", "Pourquoi ?"],
    ["Par an depuis 2023", "900+ h"],
    ["Pas à pas", "Patience"],
    ["Formateur depuis", "2021"],
    ["En toute sérénité", "Bienveillance"],
    ["Écoles et organismes", "5"],
  ];
  const canvas = document.getElementById("cube-canvas");
  const area = document.getElementById("cube-area");
  const hero = document.getElementById("hero");
  let renderer;
  try {
    // Without motion, one frame is drawn: keep it, so that it survives the compositing.
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: !motion || shot });
  } catch {
    canvas.remove();
  }

  if (renderer) {
    const family = css("--font-title");
    await Promise.all([document.fonts.load(`800 120px ${family}`), document.fonts.load(`700 24px ${family}`)]);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 14);

    function faceTexture([small, big]) {
      const size = 512;
      const paint = document.createElement("canvas");
      paint.width = paint.height = size;
      const g = paint.getContext("2d");
      g.fillStyle = "#111111";
      g.fillRect(0, 0, size, size);
      g.strokeStyle = "rgba(255, 255, 255, 0.06)";
      for (let x = 0; x <= size; x += 32) {
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, size); g.stroke();
        g.beginPath(); g.moveTo(0, x); g.lineTo(size, x); g.stroke();
      }
      g.fillStyle = "#a3a3a3";
      g.font = `700 24px ${family}`;
      g.letterSpacing = "4px";
      g.textBaseline = "top";
      g.fillText(small.toUpperCase(), 48, 52);
      g.letterSpacing = "-4px";
      g.fillStyle = "#ffffff";
      let fontSize = 160;
      do { g.font = `800 ${fontSize}px ${family}`; fontSize -= 4; } while (g.measureText(big).width > size - 96);
      g.textBaseline = "alphabetic";
      g.fillText(big, 44, size - 70);
      g.fillRect(48, size - 50, 72, 8);
      const texture = new THREE.CanvasTexture(paint);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const white = new THREE.Color("#ffffff");
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const cube = new THREE.Mesh(geometry, FACES.map(face => new THREE.MeshBasicMaterial({ map: faceTexture(face), transparent: true, opacity: 0.95 })));
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: white, transparent: true, opacity: 0.9 })));
    const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.7, 2.7, 2.7)), new THREE.LineBasicMaterial({ color: white, transparent: true, opacity: 0.16 }));
    const rig = new THREE.Group();
    rig.add(cube, shell);
    scene.add(rig);

    // Place the cube on the visual area of the hero, whatever the layout.
    function layout() {
      const box = hero.getBoundingClientRect();
      const spot = area.getBoundingClientRect();
      renderer.setSize(box.width, box.height, false);
      camera.aspect = box.width / box.height;
      camera.updateProjectionMatrix();
      const height = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      const unit = height / box.height;
      rig.position.x = (spot.left + spot.width / 2 - box.left - box.width / 2) * unit;
      rig.position.y = -(spot.top + spot.height / 2 - box.top - box.height / 2) * unit + 0.2;
      rig.scale.setScalar(Math.min(spot.width, spot.height) * unit / (box.width < 900 ? 3.9 : 4.6));
    }
    new ResizeObserver(layout).observe(hero);
    layout();

    // Rotation: the cube presents its faces one after the other, squarely, in the order of the
    // messages. Under the mouse it follows the pointer (to the right it shows its right face, at
    // the edges its back, top and bottom), and resumes from the nearest face when the mouse
    // leaves. A drag spins it, and the scroll turns it a little more.
    const state = { scroll: 0, scale: motion ? 0 : 1 };
    const lean = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.28, -0.42, 0));
    const FACE_TURNS = [[0, -Math.PI / 2], [Math.PI / 2, 0], [0, 0], [0, Math.PI / 2], [-Math.PI / 2, 0], [0, Math.PI]];
    const faceViews = FACE_TURNS.map(([x, y]) => lean.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, 0))));
    let face = 0, nextFace = 3.2;
    const presented = faceViews[0].clone();
    const followed = new THREE.Quaternion();
    let drag = null, follow = null;
    const clock = new THREE.Clock();
    // The pointer from -1 to 1 across the area of the cube.
    const across = event => {
      const spot = area.getBoundingClientRect();
      return [(event.clientX - spot.left) / spot.width * 2 - 1, (event.clientY - spot.top) / spot.height * 2 - 1];
    };
    area.addEventListener("pointerdown", event => { drag = { x: event.clientX, y: event.clientY }; follow = null; area.setPointerCapture(event.pointerId); });
    area.addEventListener("pointermove", event => {
      if (drag) {
        const turn = new THREE.Euler((event.clientY - drag.y) * 0.009, (event.clientX - drag.x) * 0.009, 0);
        presented.premultiply(new THREE.Quaternion().setFromEuler(turn));
        drag = { x: event.clientX, y: event.clientY };
        return;
      }
      if (event.pointerType !== "mouse") return;
      const [nx, ny] = across(event);
      // The first move sets the start, so that the cube doesn't jump when the pointer comes in.
      if (!follow) follow = { x: nx, y: ny, base: presented.clone() };
      const turn = new THREE.Euler((ny - follow.y) * Math.PI / 2, (nx - follow.x) * Math.PI, 0);
      followed.setFromEuler(turn).multiply(follow.base);
    });
    area.addEventListener("pointerup", () => { drag = null; nextFace = clock.getElapsedTime() + 2.5; });
    area.addEventListener("pointerleave", () => {
      follow = null;
      // Resume from the face that is nearest to what the visitor is looking at.
      face = faceViews.reduce((best, view, index) => Math.abs(view.dot(presented)) > Math.abs(faceViews[best].dot(presented)) ? index : best, 0);
      nextFace = clock.getElapsedTime() + 2;
    });
    const scrollTurn = new THREE.Quaternion();

    let visible = true;
    new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(hero);
    function frame() {
      const time = clock.getElapsedTime();
      if (motion) {
        if (follow) presented.slerp(followed, 0.1);
        else if (!drag) {
          if (time >= nextFace) { face = (face + 1) % faceViews.length; nextFace = time + 3.2; }
          presented.slerp(faceViews[face], 0.06);
        }
        shell.rotation.x = -time * 0.15;
        shell.rotation.y = time * 0.11;
      }
      scrollTurn.setFromEuler(new THREE.Euler(state.scroll * 0.6, state.scroll * 1.4, 0));
      cube.quaternion.copy(scrollTurn).multiply(presented);
      cube.scale.setScalar(state.scale);
      renderer.render(scene, camera);
      // Headless screenshots don't show WebGL: ?shot=1 copies the first frame into an image.
      if (shot && !frame.done) { frame.done = true; const copy = new Image(); copy.src = canvas.toDataURL(); copy.className = "app-hero-canvas"; canvas.after(copy); }
    }
    if (motion) {
      renderer.setAnimationLoop(() => { if (visible) frame(); });
      gsap.to(state, { scale: 1, duration: 1.6, delay: 0.5, ease: "elastic.out(1, 0.6)" });
      gsap.to(state, { scroll: 1, ease: "none", scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: 0.6 } });
      gsap.to(canvas, { yPercent: 18, autoAlpha: 0.2, ease: "none", scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: true } });
    } else {
      frame();
      new ResizeObserver(frame).observe(hero);
    }
  }

  // ── Covers of the offers: one small Three.js scene per domain ─────────────────────────
  // A single renderer draws every scene, then each frame is copied into the canvas of its
  // card: one WebGL context for all the covers, and the covers follow the cards (reveal, tilt).
  let coverRenderer;
  try {
    coverRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch {
    coverRenderer = null;
  }
  if (coverRenderer) {
    const dpr = Math.min(devicePixelRatio, 2);
    const WHITE = 0xffffff;
    const FILL = 0x151515;
    const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);
    const ease = x => x * x * (3 - 2 * x);
    const lineMaterial = opacity => new THREE.LineBasicMaterial({ color: WHITE, transparent: true, opacity });
    const outline = (geometry, opacity = 1, threshold = 10) => new THREE.LineSegments(new THREE.EdgesGeometry(geometry, threshold), lineMaterial(opacity));
    const block = (geometry, opacity = 1) => {
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: FILL }));
      mesh.add(outline(geometry, opacity));
      return mesh;
    };
    const dot = (radius = 0.06, opacity = 1) => new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), new THREE.MeshBasicMaterial({ color: WHITE, transparent: true, opacity }));
    const polyline = (points, opacity = 1) => new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMaterial(opacity));
    const view = (x, y, z, look = [0, 0, 0]) => {
      const camera = new THREE.PerspectiveCamera(32, 3 / 2, 0.1, 100);
      camera.position.set(x, y, z);
      camera.lookAt(...look);
      return camera;
    };

    const SCENES = {
      // Initiation: a little robot finds its way on a grid, step by step, as in Robomind.
      steps() {
        const scene = new THREE.Scene();
        scene.add(new THREE.GridHelper(6, 6, 0x5a5a5a, 0x2a2a2a));
        const path = [[-1.5, -1.5], [-0.5, -1.5], [0.5, -1.5], [0.5, -0.5], [0.5, 0.5], [1.5, 0.5], [1.5, 1.5]];
        scene.add(polyline(path.map(([x, z]) => v(x, 0.01, z)), 0.35));
        const goal = outline(new THREE.CylinderGeometry(0.34, 0.34, 0.02, 40), 0.9);
        goal.position.set(1.5, 0.02, 1.5);
        scene.add(goal);
        const robot = block(new THREE.BoxGeometry(0.6, 0.6, 0.6));
        const eye = dot(0.06);
        eye.position.set(0, 0.1, 0.31);
        robot.add(eye);
        scene.add(robot);
        const last = path.length - 1;
        return { scene, camera: view(3.8, 4.9, 5.7), update(t) {
          const p = (t * 1.1) % (last + 2);
          const done = p >= last;
          const i = done ? last - 1 : Math.floor(p);
          const f = done ? 1 : ease(p - i);
          const [ax, az] = path[i], [bx, bz] = path[i + 1];
          robot.position.set(ax + (bx - ax) * f, 0.3 + (done ? 0 : Math.sin(f * Math.PI) * 0.25), az + (bz - az) * f);
          robot.rotation.y = Math.atan2(bx - ax, bz - az);
          goal.scale.setScalar(done ? 1 + Math.sin((p - last) / 2 * Math.PI) * 0.5 : 1);
        } };
      },
      // Web: the layers of a page (structure, style, behavior) pulled apart.
      web() {
        const scene = new THREE.Scene();
        const stack = new THREE.Group();
        scene.add(stack);
        const pages = [0, 1, 2].map(index => {
          const page = new THREE.Group();
          const w = 3.2, h = 2.1, front = index === 2;
          page.add(block(new THREE.PlaneGeometry(w, h), front ? 1 : 0.45));
          page.add(polyline([v(-w / 2, h / 2 - 0.3, 0.01), v(w / 2, h / 2 - 0.3, 0.01)], front ? 0.6 : 0.3));
          [0, 1, 2].forEach(k => {
            const light = dot(0.045, front ? 0.9 : 0.4);
            light.position.set(-w / 2 + 0.2 + k * 0.15, h / 2 - 0.15, 0.01);
            page.add(light);
          });
          [[0.35, 1.6], [0.1, 2.2], [-0.15, 1.2]].forEach(([y, length]) => page.add(polyline([v(-1.35, y, 0.01), v(-1.35 + length, y, 0.01)], front ? 0.7 : 0.3)));
          const box = outline(new THREE.PlaneGeometry(1.1, 0.6), front ? 0.8 : 0.35);
          box.position.set(0.85, -0.6, 0.01);
          page.add(box);
          stack.add(page);
          return page;
        });
        return { scene, camera: view(0, 0.5, 6.4, [0, 0, -0.6]), update(t) {
          const spread = 0.6 + Math.sin(t * 0.9) * 0.3;
          pages.forEach((page, i) => page.position.set((i - 1) * 0.35, (i - 1) * -0.2, (i - 2) * spread));
          stack.rotation.set(-0.12, -0.55 + Math.sin(t * 0.5) * 0.2, 0);
        } };
      },
      // Python and data: a field of bars rising and falling like live data.
      chart() {
        const scene = new THREE.Scene();
        scene.add(new THREE.GridHelper(5, 5, 0x4a4a4a, 0x262626));
        const unit = new THREE.BoxGeometry(0.5, 1, 0.5);
        unit.translate(0, 0.5, 0);
        const bars = [];
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
          const bar = block(unit, 0.85);
          bar.position.set((i - 1.5) * 0.85, 0, (j - 1.5) * 0.85);
          scene.add(bar);
          bars.push([bar, i, j]);
        }
        return { scene, camera: view(4.3, 3.8, 5.5, [0, 0.55, 0]), update(t) {
          bars.forEach(([bar, i, j]) => { bar.scale.y = 0.2 + 1.6 * (0.5 + 0.5 * Math.sin(t * 1.4 + i * 0.7 + j * 1.1)) * (0.4 + (i + j) / 10); });
        } };
      },
      // Databases: a stack of disks, with a ring of records moving around it.
      database() {
        const scene = new THREE.Scene();
        const disk = new THREE.CylinderGeometry(1.2, 1.2, 0.42, 64);
        const disks = [0, 1, 2].map(() => { const mesh = block(disk, 0.95); scene.add(mesh); return mesh; });
        const ring = new THREE.Group();
        for (let k = 0; k < 16; k++) {
          const record = dot(0.045, 0.9);
          const angle = k / 16 * Math.PI * 2;
          record.position.set(Math.cos(angle) * 1.75, 0, Math.sin(angle) * 1.75);
          ring.add(record);
        }
        scene.add(ring);
        return { scene, camera: view(0, 2.5, 7, [0, 0.25, 0]), update(t) {
          disks.forEach((mesh, i) => { mesh.position.y = (i - 1) * 0.62 + Math.sin(t * 1.6 + i) * 0.06; });
          ring.rotation.y = -t * 0.6;
          ring.position.y = Math.sin(t * 0.8) * 0.7;
        } };
      },
      // Method and tests: a Git graph, a branch that leaves the main line and merges back, tested.
      branch() {
        const scene = new THREE.Scene();
        const graph = new THREE.Group();
        scene.add(graph);
        const main = new THREE.LineCurve3(v(-2.6, -0.5), v(2.6, -0.5));
        const feature = new THREE.CatmullRomCurve3([v(-1.6, -0.5), v(-0.9, 0.55, 0.3), v(0.9, 0.55, 0.3), v(1.6, -0.5)]);
        graph.add(polyline(main.getPoints(2), 0.7), polyline(feature.getPoints(48), 0.7));
        const commits = [...[-2.2, -1.6, -0.4, 0.6, 1.6, 2.2].map(x => v(x, -0.5)), ...[0.2, 0.5, 0.8].map(u => feature.getPoint(u))].map(point => {
          const commit = dot(0.1);
          commit.position.copy(point);
          graph.add(commit);
          return commit;
        });
        const pulses = [dot(0.06, 0.8), dot(0.06, 0.8)];
        graph.add(...pulses);
        const check = polyline([v(-0.2, 0), v(-0.06, -0.15), v(0.24, 0.2)]);
        check.position.set(2.2, 0.05, 0);
        graph.add(check);
        return { scene, camera: view(0, 0.4, 6.6), update(t) {
          pulses[0].position.copy(main.getPoint((t * 0.25) % 1));
          pulses[1].position.copy(feature.getPoint((t * 0.32) % 1));
          commits.forEach((commit, k) => commit.scale.setScalar(1 + Math.max(0, Math.sin(t * 2 - k * 0.7)) * 0.4));
          check.material.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.5));
          graph.rotation.set(0.15, Math.sin(t * 0.4) * 0.35, 0);
        } };
      },
      // AI: a small neural network, with signals running through its links.
      network() {
        const scene = new THREE.Scene();
        const net = new THREE.Group();
        scene.add(net);
        const layers = [3, 5, 5, 2].map((count, l) => Array.from({ length: count }, (_, k) => v((l - 1.5) * 1.35, (k - (count - 1) / 2) * 0.55, Math.sin(k * 1.7 + l) * 0.25)));
        const links = layers.slice(0, -1).flatMap((layer, l) => layer.flatMap(a => layers[l + 1].map(b => [a, b, l])));
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(links.flatMap(([a, b]) => [a.x, a.y, a.z, b.x, b.y, b.z]), 3));
        net.add(new THREE.LineSegments(geometry, lineMaterial(0.18)));
        layers.flat().forEach(point => { const neuron = dot(0.09); neuron.position.copy(point); net.add(neuron); });
        // Each signal crosses the network layer by layer, on links chosen by a fixed sequence.
        const signals = Array.from({ length: 8 }, (_, k) => { const mesh = dot(0.05); net.add(mesh); return { mesh, seed: k * 5 + 3 }; });
        return { scene, camera: view(0, 0, 6.4), update(t) {
          signals.forEach(signal => {
            const p = (t * 0.7 + signal.seed * 0.37) % 3;
            const l = Math.floor(p);
            const choices = links.filter(link => link[2] === l);
            const [a, b] = choices[(signal.seed * 7 + Math.floor(t * 0.7 + signal.seed * 0.37) * 3) % choices.length];
            signal.mesh.position.lerpVectors(a, b, p - l);
          });
          net.rotation.y = Math.sin(t * 0.35) * 0.5;
        } };
      },
      // Project management: a Scrum board where a card moves from one column to the next.
      board() {
        const scene = new THREE.Scene();
        const board = new THREE.Group();
        scene.add(board);
        const columns = [-1.5, 0, 1.5];
        columns.forEach(x => {
          const column = outline(new THREE.PlaneGeometry(1.3, 2.6), 0.4);
          column.position.x = x;
          board.add(column, polyline([v(x - 0.65, 1.0), v(x + 0.65, 1.0)], 0.4));
        });
        const card = new THREE.BoxGeometry(1.0, 0.32, 0.06);
        [[0, 0.6], [0, 0.15], [1, 0.6], [2, 0.6], [2, 0.15], [2, -0.3]].forEach(([c, y]) => {
          const still = block(card, 0.5);
          still.position.set(columns[c], y, 0.05);
          board.add(still);
        });
        const mover = block(card);
        board.add(mover);
        const stops = [v(columns[0], -0.3, 0.05), v(columns[1], -0.3, 0.05), v(columns[2], -0.75, 0.05)];
        return { scene, camera: view(0.7, 0.5, 5.7), update(t) {
          const p = (t * 0.5) % 3, leg = Math.floor(p), f = ease(Math.min(1, (p - leg) * 1.5));
          if (leg < 2) {
            mover.position.lerpVectors(stops[leg], stops[leg + 1], f);
            mover.position.z += Math.sin(f * Math.PI) * 0.5;
            mover.rotation.z = Math.sin(f * Math.PI) * 0.12;
          } else {
            mover.position.copy(stops[2]);
            mover.rotation.z = 0;
          }
          board.rotation.set(-0.1, -0.25 + Math.sin(t * 0.4) * 0.12, 0);
        } };
      },
      // Custom: modules that come apart and fit back together.
      custom() {
        const scene = new THREE.Scene();
        const group = new THREE.Group();
        scene.add(group);
        const piece = new THREE.BoxGeometry(0.7, 0.7, 0.7);
        const parts = [];
        for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
          const part = block(piece, 0.9);
          group.add(part);
          parts.push([part, v(x, y, z)]);
        }
        return { scene, camera: view(2.9, 2.3, 4.7), update(t) {
          const gap = 0.36 + 0.32 * (0.5 + 0.5 * Math.sin(t * 1.2));
          parts.forEach(([part, direction]) => part.position.copy(direction).multiplyScalar(gap));
          group.rotation.set(0.3, t * 0.4, 0);
        } };
      },
    };

    const items = [...document.querySelectorAll(".app-cover")].map(cover => {
      const canvas = cover.querySelector("canvas");
      return { cover, canvas, context: canvas.getContext("2d"), card: cover.closest(".app-card"), time: 1.3, visible: true, ...SCENES[cover.dataset.scene]() };
    });
    let room = [0, 0];
    function drawCover(item) {
      const width = Math.round(item.cover.clientWidth * dpr), height = Math.round(item.cover.clientHeight * dpr);
      if (!width || !height) return;
      if (item.canvas.width !== width || item.canvas.height !== height) {
        item.canvas.width = width;
        item.canvas.height = height;
        item.camera.aspect = width / height;
        item.camera.updateProjectionMatrix();
      }
      if (room[0] < width || room[1] < height) {
        room = [Math.max(room[0], width), Math.max(room[1], height)];
        coverRenderer.setSize(room[0], room[1], false);
      }
      item.update(item.time);
      coverRenderer.setViewport(0, 0, width, height);
      coverRenderer.setScissor(0, 0, width, height);
      coverRenderer.setScissorTest(true);
      coverRenderer.setClearColor(0x000000, 0);
      coverRenderer.clear();
      coverRenderer.render(item.scene, item.camera);
      item.context.clearRect(0, 0, width, height);
      item.context.drawImage(coverRenderer.domElement, 0, room[1] - height, width, height, 0, 0, width, height);
    }
    if (motion) {
      // Only the covers on screen move; a card under the pointer plays faster.
      const watcher = new IntersectionObserver(entries => entries.forEach(entry => { items.find(item => item.cover === entry.target).visible = entry.isIntersecting; }));
      items.forEach(item => watcher.observe(item.cover));
      const clock = new THREE.Clock();
      coverRenderer.setAnimationLoop(() => {
        const delta = Math.min(clock.getDelta(), 0.1);
        items.forEach(item => {
          if (!item.visible) return;
          item.time += delta * (item.card.matches(":hover") ? 2.2 : 1);
          drawCover(item);
        });
      });
    } else {
      items.forEach(item => new ResizeObserver(() => drawCover(item)).observe(item.cover));
    }
  }

  // ── Animations ────────────────────────────────────────────────────────────────────
  if (motion) {
    window.sylentIntro = true;
    // Intro: the title rises line by line from behind a mask.
    const split = SplitText.create(".app-hero-title", { type: "lines", mask: "lines" });
    gsap.set(".app-intro", { visibility: "visible" });
    gsap.timeline({ defaults: { ease: "expo.out", duration: 1.1 } })
      .from(header, { yPercent: -100, duration: 0.9 })
      .from(split.lines, { yPercent: 110, stagger: 0.09, duration: 1.2 }, "-=0.5")
      .from([".app-hero-sub", ".app-hero-actions", ".app-hero-motto"], { y: 28, autoAlpha: 0, stagger: 0.1 }, "-=0.8");

    // Reveals on scroll, in small batches.
    ScrollTrigger.batch(".app-reveal", {
      start: "top 88%",
      onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, stagger: 0.08, duration: 1, ease: "power3.out", overwrite: true }),
    });

    // Section headings, as on the former site: the title rises, the large word behind it
    // slides as the page scrolls.
    document.querySelectorAll(".app-heading").forEach(block => {
      const title = block.querySelector(".app-heading-title");
      SplitText.create(title, { type: "words", mask: "words", onSplit: self => gsap.from(self.words, { yPercent: 100, stagger: 0.05, duration: 1, ease: "expo.out", scrollTrigger: { trigger: block, start: "top 86%" } }) });
      gsap.fromTo(block.querySelector(".app-heading-ghost"), { xPercent: 6 }, { xPercent: -4, ease: "none", scrollTrigger: { trigger: block, start: "top bottom", end: "bottom top", scrub: true } });
    });
    gsap.fromTo(".app-cta-ghost", { xPercent: 8 }, { xPercent: -8, ease: "none", scrollTrigger: { trigger: ".app-cta", start: "top bottom", end: "bottom top", scrub: true } });

    // The rules of the pedagogy draw themselves as the section scrolls.
    gsap.utils.toArray(".app-step-rule").forEach((rule, index) => {
      gsap.fromTo(rule, { "--progress": 0 }, { "--progress": 1, ease: "none", scrollTrigger: { trigger: ".app-steps", start: `top ${80 - index * 6}%`, end: `top ${40 - index * 6}%`, scrub: true } });
    });

    // The figures count up.
    gsap.utils.toArray(".app-count").forEach(counter => {
      const value = { n: Number(counter.dataset.from || 0) };
      gsap.to(value, { n: Number(counter.dataset.to), duration: 2, ease: "power2.out", scrollTrigger: { trigger: counter, start: "top 92%" }, onUpdate: () => { counter.textContent = Math.round(value.n); } });
    });

    // Pointer devices: the cards tilt and light up under the pointer, the main buttons are
    // magnetic.
    if (matchMedia("(hover: hover)").matches) {
      document.querySelectorAll(".app-tilt").forEach(card => {
        const rotateX = gsap.quickTo(card, "rotationX", { duration: 0.6, ease: "power3" });
        const rotateY = gsap.quickTo(card, "rotationY", { duration: 0.6, ease: "power3" });
        gsap.set(card, { transformPerspective: 900 });
        card.addEventListener("pointermove", event => {
          const box = card.getBoundingClientRect();
          const x = (event.clientX - box.left) / box.width, y = (event.clientY - box.top) / box.height;
          card.style.setProperty("--mx", `${x * 100}%`);
          card.style.setProperty("--my", `${y * 100}%`);
          rotateY((x - 0.5) * 7);
          rotateX((0.5 - y) * 7);
        });
        card.addEventListener("pointerleave", () => { rotateX(0); rotateY(0); });
      });
      document.querySelectorAll(".app-magnetic").forEach(button => {
        const moveX = gsap.quickTo(button, "x", { duration: 0.5, ease: "power3" });
        const moveY = gsap.quickTo(button, "y", { duration: 0.5, ease: "power3" });
        button.addEventListener("pointermove", event => {
          const box = button.getBoundingClientRect();
          moveX((event.clientX - box.left - box.width / 2) * 0.3);
          moveY((event.clientY - box.top - box.height / 2) * 0.4);
        });
        button.addEventListener("pointerleave", () => { moveX(0); moveY(0); });
      });
    }
  } else {
    document.querySelectorAll(".app-intro").forEach(element => { element.style.visibility = "visible"; });
  }
</script>
</body>
</html>
