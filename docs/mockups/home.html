<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Mock-up</title>
<!--
  Mock-up of the pages (step 4 of roadmap.md): the layout of set 1 of docs/wireframes in the
  chosen style, at phone and desktop width. The page itself is home-site.html, shown here in
  frames; switch the view with the bar at the top, or open it directly, e.g. ?view=desktop.

  Serve the repository root, so that the frames load even in a sandboxed browser:
    python3 -m http.server 8781 --bind 127.0.0.1
  then open http://127.0.0.1:8781/docs/mockups/home.html
-->
<style>
  /* The page around the frames: neutral, so that it doesn't compete with the styles. */
  body { margin: 0; background: #1f2226; color: #e9ecef; font: 14px/1.4 system-ui, sans-serif; }
  .page-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding: 10px 16px; background: #15171a; border-bottom: 1px solid #33383e; }
  .page-bar strong { font-size: 14px; letter-spacing: .02em; }
  .page-group { display: flex; align-items: center; gap: 4px; }
  .page-group > span { margin-right: 6px; color: #adb5bd; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .page-group button { padding: 5px 11px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-group button[aria-pressed="true"] { background: #e9ecef; color: #15171a; border-color: #e9ecef; }
  .page-bar p { flex-basis: 100%; margin: 0; color: #adb5bd; }
  .page-stage { display: flex; gap: 32px; align-items: flex-start; justify-content: center; padding: 24px 16px 40px; }
  .page-slot > span { display: block; margin-bottom: 8px; color: #adb5bd; font-size: 12px; }
  .page-phone { padding: 12px; border-radius: 44px; background: #0c0d0f; box-shadow: 0 0 0 1px #3a3f45, 0 30px 80px #0008; }
  .page-phone iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 32px; background: #fff; }
  .page-desktop { overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px #3a3f45, 0 30px 80px #0008; }
  .page-desktop iframe { display: block; border: 0; background: #fff; transform-origin: 0 0; }
  .page-stage.is-desktop { padding: 0; }
  .page-stage.is-desktop .page-slot { width: 100%; }
  .page-stage.is-desktop .page-slot > span { display: none; }
  .page-stage.is-desktop .page-desktop { border-radius: 0; box-shadow: none; }
  .page-warning { margin: 0; padding: 10px 16px; background: #8a6a10; color: #fff; }
</style>
</head>
<body>
<p class="page-warning" id="file-warning" hidden>Opened as a file: serve the repository root (see the comment at the top of this page) so that the frames load.</p>
<div class="page-bar" id="bar"></div>
<main class="page-stage" id="stage"></main>
<script>
  const VARIANTS = {
    page: {
      label: "Page",
      options: { home: "Home", contact: "Contact" },
      fallback: "home",
    },
    // The states of the contact form (only for the contact page).
    state: {
      label: "Form",
      options: { empty: "Empty", errors: "Errors", sending: "Sending", sent: "Sent", failed: "Failed" },
      fallback: "empty",
      only: "contact",
    },
    // Arriving on the contact page directly, or from the button of an offer page.
    arrival: {
      label: "Arrival",
      options: { direct: "Direct", offer: "From an offer" },
      fallback: "direct",
      only: "contact",
    },
    view: {
      label: "View",
      options: { both: "Mobile and desktop", desktop: "Desktop, full width", mobile: "Mobile" },
      fallback: "both",
    },
  };
  // The Console style chosen by the owner, in white instead of green, with Manrope for the titles
  // and Anaheim medium for the text, and the headings of the former site. Atelier was set aside.
  const NOTE = "Night style: neutral blacks and white, Manrope for the titles, Anaheim medium for the text, the SYLENT logo, the headings of the former site.";
  const FILES = { home: "home-site.html", contact: "contact-site.html" };

  const params = new URLSearchParams(location.search);
  const chosen = Object.fromEntries(Object.entries(VARIANTS).map(([key, variant]) =>
    [key, params.get(key) in variant.options ? params.get(key) : variant.fallback]));

  const site = () => FILES[chosen.page] + (chosen.page === "contact" ? `?${[chosen.state !== "empty" ? `state=${chosen.state}` : "", chosen.arrival === "offer" ? "formation=developpement-web" : ""].filter(Boolean).join("&")}` : "");
  const phone = () => `<div class="page-slot"><span>Mobile · 390 × 844 · scroll inside the phone</span><div class="page-phone"><iframe src="${site()}" title="Page at phone width"></iframe></div></div>`;
  const desktop = () => `<div class="page-slot page-fit"><span>Desktop · 1280 × 800 · scaled to fit, scroll inside</span><div class="page-desktop"><iframe src="${site()}" width="1280" height="800" title="Page at desktop width"></iframe></div></div>`;

  function render() {
    document.getElementById("bar").innerHTML = `<strong>sylent.art · mock-up</strong>` +
      Object.entries(VARIANTS).filter(([, variant]) => !variant.only || variant.only === chosen.page).map(([key, variant]) => `<div class="page-group"><span>${variant.label}</span>${
        Object.entries(variant.options).map(([value, label]) =>
          `<button type="button" data-variant="${key}" data-value="${value}" aria-pressed="${chosen[key] === value}">${label}</button>`).join("")}</div>`).join("") +
      `<p>${NOTE} Sample content; photo and logo of IGENSIA Tech to come.</p>`;
    const stage = document.getElementById("stage");
    stage.className = `page-stage is-${chosen.view}`;
    stage.innerHTML = chosen.view === "mobile" ? phone() : chosen.view === "desktop"
      ? `<div class="page-slot"><div class="page-desktop"><iframe src="${site()}" title="Page at full width"></iframe></div></div>`
      : phone() + desktop();
    fit();
  }

  // The desktop frame keeps 1280 px of layout and is scaled down to the room left.
  function fit() {
    const frame = document.querySelector(".page-desktop iframe");
    if (!frame) return;
    const holder = frame.parentElement;
    if (chosen.view === "desktop") {
      const height = innerHeight - document.getElementById("bar").offsetHeight;
      Object.assign(frame.style, { width: "100%", height: `${height}px`, transform: "none" });
      holder.style.width = holder.style.height = "";
      return;
    }
    const room = document.getElementById("stage").clientWidth - 32 - (chosen.view === "both" ? 414 + 32 : 0);
    const scale = Math.min(1, room / 1280);
    const height = Math.max(600, Math.min(800, (innerHeight - 140) / scale));
    Object.assign(frame.style, { width: "1280px", height: `${height}px`, transform: `scale(${scale})` });
    holder.style.width = `${1280 * scale}px`;
    holder.style.height = `${height * scale}px`;
  }

  document.getElementById("bar").addEventListener("click", event => {
    const { variant, value } = event.target.dataset;
    if (!variant) return;
    chosen[variant] = value;
    history.replaceState(null, "", "?" + new URLSearchParams(chosen));
    render();
  });
  addEventListener("resize", fit);
  document.getElementById("file-warning").hidden = location.protocol !== "file:";
  render();
</script>
</body>
</html>
