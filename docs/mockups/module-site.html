<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module · Formations · Sylent</title>
<meta name="description" content="Le programme du module, son public, ses prérequis et ses objectifs, sur site ou à distance.">
<!--
  The page of one module of sylent.art, shown at phone and desktop width by home.html
  (?page=module); ?module=<formation>-<module> opens another module, or ?module=<formation> for a
  formation of a single module (keys in shared/formations.js). The parts shared by every page are
  in shared/.
  Updated at step 13b of roadmap.md (wireframe docs/wireframes/formations.excalidraw), after the
  built site: no breadcrumb; the hero over the grid, its formation above the title (a link to the
  page of the formation, with the framework mark) and as the faded word behind it, or, for a
  module alone in its formation, its first domain. Then the key facts under a rule (public, level, formats: no duration, asked
  by the owner on 2026-10-30); the prerequisites, the objectives and the
  program, beside a card that follows the scroll on a computer; the other modules of its
  formation (« Dans la même formation »), or of its domain for a module alone in its formation.
  Content copied from src/content/modules/ (shared/programs.js).
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500&display=block">
<link rel="stylesheet" href="shared/site.css">
<link rel="stylesheet" href="shared/formations.css">
<style>
  .app-module-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-9); }

  /* ── Key facts: plain columns under a rule ──────────────────────────────────────── */

  .app-facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-7) var(--space-6); margin: 0; }
  @media (min-width: 900px) { .app-facts { grid-template-columns: repeat(3, 1fr); } }
  .app-facts div { padding-top: var(--space-5); border-top: 1px solid var(--line); }
  .app-facts dt { color: var(--dim); font: var(--label-weight) var(--size-label)/1.3 var(--font-title); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  .app-facts dd { margin: var(--space-3) 0 0; font: 700 var(--size-title-small)/1.35 var(--font-title); letter-spacing: var(--tracking-card); }

  /* ── Body: prerequisites, objectives and program, beside the card to organize ─────── */

  .app-module-body { display: grid; gap: var(--space-14); padding-block: var(--space-fluid-3); }
  @media (min-width: 900px) { .app-module-body { grid-template-columns: 8fr 4fr; gap: var(--space-18); align-items: start; } }
  .app-module-main > section + section { margin-top: var(--space-fluid-3); }
  .app-module-main h2 { margin: 0 0 var(--space-6); font: var(--title-weight) var(--size-h2)/1.1 var(--font-title); letter-spacing: var(--tracking-title); }
  .app-module-main > section > p { margin: 0; max-width: var(--measure); color: var(--secondary); font-size: var(--size-lead); }

  .app-objectives { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .app-objectives li { display: flex; align-items: flex-start; gap: var(--space-4); font-size: var(--size-lead); }
  .app-objectives svg { flex: none; margin-top: 2px; padding: var(--space-1); border: 1px solid var(--line-strong); box-sizing: content-box; }

  /* The parts of the program, without numbers: they are not an order, the practice comes when it
     is needed. Their rule draws itself as the page scrolls. */
  .app-program { margin: 0; padding: 0; list-style: none; }
  .app-program li { position: relative; display: grid; gap: var(--space-2); padding: var(--space-6) 0; }
  .app-program li::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: var(--line); }
  .app-program li::after { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: var(--text); transform: scaleX(var(--progress, 1)); transform-origin: left; }
  .app-program h3 { margin: 0; font: 700 var(--size-card-title)/1.25 var(--font-title); letter-spacing: var(--tracking-card); }
  .app-program p { margin: 0; color: var(--secondary); font-size: var(--size-text-small); }
  .app-program-end { margin: var(--space-2) 0 0; padding-top: var(--space-6); border-top: 1px solid var(--line); color: var(--dim); font-size: var(--size-text-small); }

  /* The card to organize the module: it follows the scroll on a computer; on a phone the header
     button and the call to action at the end are enough. */
  .app-organize { display: none; }
  @media (min-width: 900px) {
    .app-organize { position: sticky; top: calc(var(--header-height) + var(--space-6)); display: grid; gap: var(--space-3); padding: var(--card-padding-block) var(--card-padding-inline); }
  }
  .app-organize h2 { margin: 0; font: 700 var(--size-card-title)/1.2 var(--font-title); letter-spacing: var(--tracking-card); }
  .app-organize p { margin: 0; color: var(--secondary); font-size: var(--size-text-small); }
  .app-organize .app-button { margin-top: var(--space-2); }
</style>
</head>
<body data-page="courses">
<script src="shared/site.js"></script>
<script src="shared/programs.js"></script>
<script src="shared/formations.js"></script>

<main id="content"></main>

<script>
  // « Modules et packages » has no content file yet: the text agreed with the owner on 2026-10-30,
  // written at step 13c.
  PROGRAMS["modules-et-packages"] = {
    audience: ["Étudiants", "Développeurs"],
    level: "Intermédiaire",
    prerequisites: "Les bases de Python : variables, conditions, boucles et fonctions.",
    objectives: ["Isoler un projet dans un environnement virtuel", "Découper un programme en modules et en packages", "Installer et figer les dépendances d’un projet avec pip"],
    program: [
      ["L’environnement virtuel", "Isoler les dépendances de chaque projet, le créer et l’activer."],
      ["Les modules", "Découper un programme en fichiers, importer ce dont on a besoin."],
      ["Les packages", "Regrouper les modules en dossiers, le fichier __init__.py."],
      ["Les constantes", "Rassembler la configuration d’un projet au même endroit."],
      ["pip et PyPI", "Trouver, installer et figer les bibliothèques d’un projet."],
      ["Travaux pratiques", "Par exemple une calculatrice, un dessin crayonné ou le prix d’un fichier Excel, parmi d’autres exercices."],
    ],
    text: ["Un script grandit vite : ce module apprend à organiser un projet Python en modules et en packages, et à gérer ses dépendances dans un environnement virtuel, pour qu’il s’installe partout de la même façon."],
  };

  const module = moduleByKey(query.get("module")) || moduleByKey("php-laravel");
  const { formation } = module;
  const single = isSingle(formation);
  const domain = domainOf(module.domains[0]);
  const content = PROGRAMS[module.file || "modules-et-packages"] || PROGRAMS[module.slug];
  const title = single ? formation.title : module.title;
  document.title = single ? `${title} · Formations · Sylent` : `${title} · ${formation.title} · Formations · Sylent`;
  document.querySelector('meta[name="description"]').content = `${module.summary} Un module sur site ou à distance.`;

  // Above the title: its formation, a link to its page, with the framework mark; for a module
  // alone in its formation, its first domain. The faded word behind the title says the same, in
  // one word.
  const above = single
    ? `<a class="app-offer-link" href="${domainHref(domain)}"><span>Domaine${NB}: ${domain.title}</span>${icon("right", 14)}</a>`
    : `<a class="app-offer-link" href="${formationHref(formation)}"><span>Formation ${formation.title}</span>${icon("right", 14)}</a>${module.framework ? frameworkMark() : ""}`;
  const hero = offerHero({
    id: "module-title", title, ghost: single ? domain.ghost : formation.title, above,
    lead: content.text.map(paragraph => `<p>${paragraph.replace(/\*\*/g, "")}</p>`).join(""),
    isNew: isNewModule(module), note: isNewModule(module) ? NEW_NOTE : "",
    after: `<div class="app-module-actions app-reveal"><a class="app-button is-outline" href="#programme">Voir le programme</a></div>`,
  });

  const facts = `
    <div class="app-wrap">
      <dl class="app-facts app-reveal">
        <div><dt>Public</dt>${content.audience.map(item => `<dd>${item}</dd>`).join("")}</div>
        <div><dt>Niveau</dt><dd>${content.level}</dd></div>
        <div><dt>Formats</dt><dd>Sur site ou à distance</dd></div>
      </dl>
    </div>`;

  const main = `
    <section class="app-reveal" aria-labelledby="prerequisites-title">
      <h2 id="prerequisites-title">Prérequis</h2>
      <p>${content.prerequisites}</p>
    </section>
    <section class="app-reveal" aria-labelledby="objectives-title">
      <h2 id="objectives-title">Objectifs</h2>
      <ul class="app-objectives">${content.objectives.map(objective => `<li>${icon("check", 16)}<span>${objective}</span></li>`).join("")}</ul>
    </section>
    <section id="programme" aria-labelledby="program-title">
      <h2 class="app-reveal" id="program-title">Programme</h2>
      <ul class="app-program">${content.program.map(([part, text]) => `
        <li class="app-reveal" data-draw><h3>${part}</h3><p>${text}</p></li>`).join("")}
      </ul>
      <p class="app-program-end app-reveal">Des explications courtes, puis de la pratique${NB}: les exercices et le projet sont adaptés au niveau du groupe.</p>
    </section>`;

  const organize = `
    <aside class="app-organize app-glass" aria-labelledby="organize-title">
      <h2 id="organize-title">Organiser ce module</h2>
      <p>Sur site ou à distance, avec un programme et des exercices adaptés à votre groupe.</p>
      <a class="app-button" href="${PAGES.contact}">Me contacter</a>
    </aside>`;

  // The neighbors: the other modules of its formation, in the advised order; for a module alone
  // in its formation, the other formations of its first domain. Then the custom card.
  const neighbors = single
    ? formationsIn(domain).filter(other => other !== formation).map(other => offerCard(other, domain))
    : published(formation).filter(other => other !== module).map(offerModuleCard);
  const related = neighbors.length ? `
    <section class="app-section" aria-labelledby="related-title" style="padding-top:0">
      <div class="app-wrap">
        ${heading(single ? "Dans le même domaine" : "Dans la même formation", "Explorer", "related-title")}
        <ul class="app-cards is-domains">${neighbors.join("")}${customCard()}</ul>
      </div>
    </section>` : "";

  document.getElementById("content").innerHTML = hero + facts + `
    <div class="app-wrap"><div class="app-module-body"><div class="app-module-main">${main}</div>${organize}</div></div>` +
    related + siteCta(`Organiser ce module${NB}?<br>Parlons de vos apprenants.`) + siteFooter();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module" src="shared/covers.js"></script>
</body>
</html>
