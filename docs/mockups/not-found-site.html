<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Sylent</title>
<meta name="description" content="Cette page n’existe pas ou a changé d’adresse.">
<meta name="robots" content="noindex">
<!--
  The not-found page of sylent.art, 404.html (mock-up, step 4 of roadmap.md), shown at phone and
  desktop width by home.html (?page=not-found). No wireframe: the hero of the home page, with its
  grid and its fluid over the whole window, a section heading whose large faded word is « 404 », its title « Oups, perdu dans l’espace » as on the former site,
  and the two ways out that specs.md asks for: the home page and the offers.
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500;700&display=block">
<link rel="stylesheet" href="shared/site.css">
<style>
  /* Room at the bottom for the wordmark of the footer, which straddles its top edge. */
  .app-lost { position: relative; display: grid; align-items: center; min-height: min(100svh, 860px); padding: calc(var(--header-height) + 48px) 0 clamp(150px, 17vw, 230px); box-sizing: border-box; }
  .app-lost::before,
  .app-lost > .app-grid-fluid {
    content: "";
    position: absolute;
    inset: 0;
    mask-image: radial-gradient(75% 70% at 50% 45%, #000 30%, transparent 75%);
    pointer-events: none;
  }
  .app-lost::before {
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .app-lost .app-wrap { position: relative; }
  /* The faded number, larger than the other faded words: it is the whole message. */
  .app-lost .app-heading-ghost { font-size: clamp(150px, 34vw, 420px); letter-spacing: -0.04em; }
  .app-lost .app-heading-title { top: auto; bottom: 18%; }
  .app-lost .app-lead { margin-top: 0; }
  .app-lost-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
</style>
</head>
<body data-page="not-found">
<script src="shared/site.js"></script>

<main id="content"></main>

<script>
  document.getElementById("content").innerHTML = `
    <section class="app-lost" aria-labelledby="lost-title" data-grid>
      <div class="app-wrap">
        ${heading("Oups, perdu dans l’espace", "404", "lost-title", 1)}
        <p class="app-lead app-reveal">Cette page n’existe pas ou a changé d’adresse.<br>Les formations, elles, sont toujours là.</p>
        <div class="app-lost-actions app-reveal">
          <a class="app-button app-magnetic" href="${PAGES.home}">Retour à l’accueil</a>
          <a class="app-button is-outline" href="${PAGES.courses}">Voir les formations</a>
        </div>
      </div>
    </section>
    ${siteFooter()}`;
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
</body>
</html>
