<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Sylent</title>
<meta name="description" content="Cette page n’existe pas ou a changé d’adresse.">
<meta name="robots" content="noindex">
<!--
  The not-found page of sylent.art, 404.html (mock-up, step 4 of roadmap.md), shown at phone and
  desktop width by home.html (?page=not-found). No wireframe: the hero of the home page, with its
  grid and its fluid over the whole window, a section heading whose large faded word is « 404 », its title « Oups, perdu dans l’espace » as on the former site (« Page introuvable » on a phone),
  and the two ways out that specs.md asks for: the home page and the offers.
-->
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Anaheim:wght@500;700&display=block">
<link rel="stylesheet" href="shared/site.css">
<style>
  /* Room at the bottom for the wordmark of the footer, which straddles its top edge. */
  .app-lost { position: relative; display: grid; align-items: center; min-height: min(100svh, 860px); padding: calc(var(--header-height) + var(--space-12)) 0 var(--space-wordmark); box-sizing: border-box; }
  .app-lost::before,
  .app-lost > .app-grid-fluid {
    content: "";
    position: absolute;
    inset: 0;
    mask-image: radial-gradient(75% 70% at 50% 45%, #000 30%, transparent 75%);
    pointer-events: none;
  }
  .app-lost::before {
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-step) var(--grid-step);
  }
  .app-lost .app-wrap { position: relative; }
  /* The faded number, larger than the other faded words: it is the whole message. */
  .app-lost .app-heading-ghost { font-size: var(--size-ghost-404); letter-spacing: var(--tracking-tight); }
  .app-lost .app-heading-title { top: auto; bottom: 18%; }
  .app-lost .app-lead { margin-top: 0; }
  /* The title of the former site, « Oups, perdu dans l’espace », from 640 px; a phone has room
     for a shorter one. The hidden title is hidden from screen readers too. The text goes to the
     line after its first sentence from 640 px too: on a phone, that sentence already wraps. */
  .app-lost-wide { display: none; }
  @media (min-width: 640px) { span.app-lost-wide { display: inline; } br.app-lost-wide { display: initial; } .app-lost-narrow { display: none; } }
  .app-lost-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-9); }
</style>
</head>
<body data-page="not-found">
<script src="shared/site.js"></script>

<main id="content"></main>

<script>
  document.getElementById("content").innerHTML = `
    <section class="app-lost" aria-labelledby="lost-title" data-grid>
      <div class="app-wrap">
        <div class="app-heading">
          <span class="app-heading-ghost" aria-hidden="true">404</span>
          <h1 class="app-heading-title" id="lost-title"><span class="app-lost-wide">Oups, perdu dans l’espace</span><span class="app-lost-narrow">Page introuvable</span></h1>
        </div>
        <p class="app-lead app-reveal">Cette page n’existe pas ou a changé d’adresse.<br class="app-lost-wide"> Les formations, elles, sont toujours là.</p>
        <div class="app-lost-actions app-reveal">
          <a class="app-button app-magnetic" href="${PAGES.home}">Retour à l’accueil</a>
          <a class="app-button is-outline" href="${PAGES.courses}">Voir les formations</a>
        </div>
      </div>
    </section>
    ${siteFooter()}`;
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="shared/motion.js"></script>
</body>
</html>
