<!doctype html>
<!--
  The media of the launch (roadmap, step 14a), side by side: each video as an Instagram story
  and as a video of the LinkedIn and Facebook feeds, with play and pause. Served by Vite, so that
  the videos reuse the scenes of the site, from the repository root:

    npx vite docs/communication --port 8781

  then open http://localhost:8781/. render.mjs turns a video into an MP4 in outputs/.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Médias du lancement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Anaheim:wght@500&display=block"
    />
    <style>
      @import "../../src/styles/tokens.css";

      :root {
        --font-manrope: "Manrope", system-ui, sans-serif;
        --font-anaheim: "Anaheim", system-ui, sans-serif;
        --scale: 0.28;
      }

      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--bg);
        color: var(--text);
        font: 500 18px / 1.5 var(--font-text);
      }

      h1 {
        margin: 0 0 8px;
        font: 800 32px / 1.1 var(--font-title);
        letter-spacing: var(--tracking-title);
      }

      .lead {
        max-width: 70ch;
        margin: 0 0 24px;
        color: var(--secondary);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 32px;
        align-items: end;
        margin-bottom: 32px;
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend,
      .label {
        margin-bottom: 8px;
        color: var(--dim);
        font: 700 13px / 1 var(--font-title);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .choices,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .choices label,
      button {
        padding: 8px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: none;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .choices label:has(input:checked),
      button[aria-pressed="true"] {
        border-color: var(--text);
        background: var(--text);
        color: var(--on-accent);
      }

      .choices label:has(input:focus-visible),
      button:focus-visible {
        outline: 2px solid var(--signal-text);
        outline-offset: 2px;
      }

      .choices input {
        position: absolute;
        opacity: 0;
      }

      .media {
        display: flex;
        flex-wrap: wrap;
        gap: 40px 32px;
        align-items: flex-start;
      }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        width: calc(1080px * var(--scale) + 22px);
      }

      .card h2 {
        margin: 0;
        font: 800 20px / 1.2 var(--font-title);
      }

      .card .label {
        margin: 0;
      }

      /* The screen: the video at its real size, scaled down. */
      .frame {
        box-sizing: content-box;
        width: calc(1080px * var(--scale));
        height: calc(var(--height) * var(--scale));
        padding: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 32px;
        background: #000;
      }

      .screen {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 22px;
      }

      .feed .frame {
        border-radius: 14px;
      }

      .feed .screen {
        border-radius: 4px;
      }

      .screen iframe {
        width: 1080px;
        height: var(--height);
        border: 0;
        transform: scale(var(--scale));
        transform-origin: 0 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .time {
        color: var(--secondary);
        font-variant-numeric: tabular-nums;
      }

      @media (width < 520px) {
        :root {
          --scale: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <h1>Médias du lancement</h1>
    <p class="lead">
      Chaque vidéo en story Instagram (9:16) et pour le fil de LinkedIn et Facebook (4:5). Chaque
      variante a son propre son, synthétisé et calé sur l’image : n’ajoute pas de musique dans
      l’appli Instagram.
    </p>
    <form class="toolbar" id="toolbar">
      <fieldset>
        <legend>Version</legend>
        <div class="choices">
          <label><input type="radio" name="version" value="teaser" checked />Teaser</label>
          <label><input type="radio" name="version" value="launch" />Lancement</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Zones couvertes par Instagram</legend>
        <div class="choices">
          <label><input type="radio" name="safe" value="" checked />Masquées</label>
          <label><input type="radio" name="safe" value="1" />Visibles</label>
        </div>
      </fieldset>
      <div>
        <div class="label">Toutes les vidéos</div>
        <div class="actions">
          <button type="button" id="play-all">Tout lire</button>
          <button type="button" id="pause-all">Tout mettre en pause</button>
          <button type="button" id="rewind-all">Revenir au début</button>
        </div>
      </div>
    </form>
    <div class="media" id="media"></div>
    <script type="module">
      const VIDEOS = [
        { variant: "a", format: "story", title: "A · Le cube", kind: "Story Instagram · 9:16", sound: true },
        { variant: "a", format: "feed", title: "A · Le cube", kind: "Fil LinkedIn, Facebook · 4:5", sound: false },
        { variant: "d", format: "story", title: "D · L’impact", kind: "Story Instagram · 9:16", sound: true },
        { variant: "d", format: "feed", title: "D · L’impact", kind: "Fil LinkedIn, Facebook · 4:5", sound: false },
      ];
      const toolbar = document.getElementById("toolbar");
      const media = document.getElementById("media");
      let audio;

      const cards = VIDEOS.map((video) => {
        const card = document.createElement("article");
        card.className = `card ${video.format}`;
        card.style.setProperty("--height", video.format === "feed" ? "1350px" : "1920px");
        card.innerHTML = `
          <div>
            <h2>${video.title}</h2>
            <p class="label">${video.kind}</p>
          </div>
          <div class="frame"><div class="screen"><iframe title="${video.title}, ${video.kind}"></iframe></div></div>
          <div class="controls">
            <button type="button" class="play" aria-pressed="false">Lecture</button>
            ${video.sound === undefined ? "" : `<button type="button" class="sound" aria-pressed="${video.sound}">Son</button>`}
            <span class="time">0,0 s</span>
          </div>`;
        media.append(card);
        const state = {
          ...video,
          card,
          iframe: card.querySelector("iframe"),
          playButton: card.querySelector(".play"),
          soundButton: card.querySelector(".sound"),
          timeLabel: card.querySelector(".time"),
          story: null,
          buffer: null,
          source: null,
          playing: false,
          time: 0,
          origin: 0,
          busy: false,
        };
        state.playButton.addEventListener("click", () => (state.playing ? pause(state) : play(state)));
        state.soundButton?.addEventListener("click", () => {
          const on = state.soundButton.getAttribute("aria-pressed") !== "true";
          state.soundButton.setAttribute("aria-pressed", String(on));
          if (state.playing) startSound(state);
        });
        return state;
      });

      /** Loads every video again, after a change of version or of the safe zones. */
      function load() {
        const data = new FormData(toolbar);
        for (const state of cards) {
          pause(state);
          state.story = null;
          state.buffer = null;
          state.time = 0;
          const query = new URLSearchParams({ variant: state.variant, format: state.format, controlled: "1" });
          if (data.get("version") === "launch") query.set("launch", "1");
          if (data.get("safe")) query.set("safe", "1");
          state.iframe.src = `./story.html?${query}`;
          state.iframe.onload = async () => {
            const view = state.iframe.contentWindow;
            while (view.document.documentElement.dataset.ready !== "true") {
              await new Promise((resolve) => setTimeout(resolve, 50));
            }
            state.story = view.story;
            const samples = state.story.sound();
            if (samples) state.buffer = new Float32Array(samples);
            show(state);
          };
        }
      }

      function show(state) {
        state.timeLabel.textContent = `${state.time.toFixed(1).replace(".", ",")} s`;
      }

      function startSound(state) {
        state.source?.stop();
        state.source = null;
        const on = state.soundButton?.getAttribute("aria-pressed") === "true";
        if (!on || !state.buffer || !state.playing || state.time >= state.story.duration) return;
        audio ??= new AudioContext();
        const buffer = audio.createBuffer(1, state.buffer.length, 48000);
        buffer.copyToChannel(state.buffer, 0);
        state.source = audio.createBufferSource();
        state.source.buffer = buffer;
        state.source.connect(audio.destination);
        state.source.start(0, state.time);
      }

      function play(state) {
        if (!state.story) return;
        state.playing = true;
        state.origin = performance.now() - state.time * 1000;
        state.playButton.textContent = "Pause";
        state.playButton.setAttribute("aria-pressed", "true");
        startSound(state);
      }

      function pause(state) {
        state.playing = false;
        state.source?.stop();
        state.source = null;
        state.playButton.textContent = "Lecture";
        state.playButton.setAttribute("aria-pressed", "false");
      }

      async function rewind(state) {
        state.time = 0;
        state.origin = performance.now();
        if (state.story) await state.story.seek(0);
        show(state);
        startSound(state);
      }

      // Each playing video loops, with a second of its last frame.
      function tick(now) {
        requestAnimationFrame(tick);
        for (const state of cards) {
          if (!state.playing || !state.story || state.busy) continue;
          let time = (now - state.origin) / 1000;
          if (time > state.story.duration + 1) {
            time = 0;
            state.origin = now;
            state.time = 0;
            startSound(state);
          }
          state.time = time;
          state.busy = true;
          state.story.seek(Math.min(time, state.story.duration)).finally(() => (state.busy = false));
          show(state);
        }
      }
      requestAnimationFrame(tick);

      document.getElementById("play-all").addEventListener("click", async () => {
        await Promise.all(cards.map(rewind));
        cards.forEach(play);
      });
      document.getElementById("pause-all").addEventListener("click", () => cards.forEach(pause));
      document.getElementById("rewind-all").addEventListener("click", () => cards.forEach(rewind));
      toolbar.addEventListener("change", load);
      load();
    </script>
  </body>
</html>
